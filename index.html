<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Floating Island | Three.js Diorama</title>
  <style>
    /* Full-viewport reset and clean canvas presentation */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #2b1b3d;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      outline: none;
    }
  </style>

  <!-- Three.js & OrbitControls via CDN Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Clean, full-screen WebGL viewport without UI overlay -->
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    /**
     * Application Singletons & State
     */
    let scene, camera, renderer, controls, composer;
    let islandGroup;
    let fireflyCount, fireflyGeo, fireflyData, fireflies, fireflyMat;

    /**
     * Entry Point: Initialize WebGL environment, lighting, geometry, and controls
     */
    function init() {
      const canvas = document.getElementById('webgl-canvas');

      // 1. Scene & Sunset Gradient Atmosphere (Patch 4)
      scene = new THREE.Scene();
      setupSunsetGradientBackground();
      scene.fog = null; // Clean diorama clarity without fog occlusion

      // 2. Camera Setup (Patch 4: Isometric angle overlooking the diorama)
      const aspect = window.innerWidth / window.innerHeight;
      camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 180);
      camera.position.set(25, 20, 25);

      // 3. Renderer with ACES Filmic Tone Mapping & Soft Shadows
      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05; // Balanced exposure to prevent white clipping
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      // 4. OrbitControls Setup (Patch 4: Centered isometric rotation)
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0); // Focus on diorama center
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5; // Slow, majestic diorama rotation
      controls.maxPolarAngle = Math.PI / 2.2; // Keep camera above horizon
      controls.minDistance = 10;
      controls.maxDistance = 75;
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // 5. Build Diorama Entities
      setupLighting();
      createFloatingIsland();
      createIslandDetails();
      setupMushroomsAndFireflies();

      // 6. Post-processing Pipeline: UnrealBloomPass & OutputPass (Calibrated for crisp diorama)
      const renderScene = new RenderPass(scene, camera);
      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.45,  // Gentle atmospheric bloom strength (prevents whiteout blowout)
        0.35,  // Bloom radius
        0.82   // Higher threshold so only glowing points/rim bloom, preserving island details
      );
      const outputPass = new OutputPass();

      composer = new EffectComposer(renderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);
      composer.addPass(outputPass);

      // 7. Responsive Resize Handling
      window.addEventListener('resize', onWindowResize, false);

      // 8. Start Render Loop
      animate();
    }

    /**
     * Procedural Sky Gradient:
     * Twilight violet top transitioning through rose-magenta to warm golden sunset.
     */
    function setupSunsetGradientBackground() {
      const canvas = document.createElement('canvas');
      canvas.width = 2;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, '#2b1b3d');   // Deep purple zenith
      gradient.addColorStop(0.5, '#6b3f6b'); // Dusk rose horizon
      gradient.addColorStop(1, '#ffaa88');   // Warm golden sunset
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 2, 512);

      const bgTexture = new THREE.CanvasTexture(canvas);
      scene.background = bgTexture;
    }

    /**
     * Lighting Setup (Patch 4: Warm sunset palette):
     * - Warm ambient illumination
     * - Angled sunset DirectionalLight casting soft shadows
     * - Bioluminescent turquoise point light beneath the island from the water ring
     */
    function setupLighting() {
      // 1. Warm Ambient Light
      const ambientLight = new THREE.AmbientLight(0xffd5b8, 0.75);
      scene.add(ambientLight);

      // 2. Sunset Directional Light
      const sunsetLight = new THREE.DirectionalLight(0xffaa88, 1.8);
      sunsetLight.position.set(-20, 15, 20);
      sunsetLight.castShadow = true;
      sunsetLight.shadow.mapSize.width = 2048;
      sunsetLight.shadow.mapSize.height = 2048;
      sunsetLight.shadow.camera.near = 0.5;
      sunsetLight.shadow.camera.far = 80;
      sunsetLight.shadow.camera.left = -25;
      sunsetLight.shadow.camera.right = 25;
      sunsetLight.shadow.camera.top = 25;
      sunsetLight.shadow.camera.bottom = -25;
      sunsetLight.shadow.bias = -0.0004;
      sunsetLight.shadow.radius = 2.0;
      scene.add(sunsetLight);

      // 3. Subtle turquoise water glow reflecting from underneath
      const waterLight = new THREE.PointLight(0x00d8f0, 1.2, 16);
      waterLight.position.set(0, -2, 0);
      scene.add(waterLight);

      // 4. Warm subtle glow near central tree roots
      const rootGlow = new THREE.PointLight(0xffaa55, 1.2, 8);
      rootGlow.position.set(0, 1.2, 0);
      scene.add(rootGlow);
    }

    /**
     * Patch 4: Floating Island Construction
     * Inverted rocky cone base, mossy green plateau top, glowing water ring, and sakura grove.
     */
    function createFloatingIsland() {
      islandGroup = new THREE.Group();

      // 1. Rocky Underbelly (Inverted cone with low-poly flat shading)
      const rockGeo = new THREE.ConeGeometry(18, 12, 16);
      rockGeo.rotateX(Math.PI); // Point downward
      const rockMat = new THREE.MeshStandardMaterial({
        color: 0x2a2438,
        roughness: 0.9,
        flatShading: true
      });
      const rockBase = new THREE.Mesh(rockGeo, rockMat);
      rockBase.position.y = -6;
      rockBase.receiveShadow = true;
      rockBase.castShadow = true;
      islandGroup.add(rockBase);

      // 2. Lush Grass Plateau (Top of the island)
      const grassGeo = new THREE.CylinderGeometry(18, 18, 1, 16);
      const grassMat = new THREE.MeshStandardMaterial({
        color: 0x2e8b57, // Sea green lush turf
        roughness: 0.8,
        flatShading: true
      });
      const grassTop = new THREE.Mesh(grassGeo, grassMat);
      grassTop.position.y = 0;
      grassTop.receiveShadow = true;
      islandGroup.add(grassTop);

      // 3. Luminous Turquoise Water Ring (Balanced soft glow)
      const waterGeo = new THREE.RingGeometry(14, 17.5, 32);
      const waterMat = new THREE.MeshStandardMaterial({
        color: 0x18d0d6,
        emissive: 0x008899,
        emissiveIntensity: 0.35,
        roughness: 0.2,
        metalness: 0.1,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide
      });
      const waterRing = new THREE.Mesh(waterGeo, waterMat);
      waterRing.rotation.x = -Math.PI / 2;
      waterRing.position.y = 0.51; // Sits slightly above grass rim
      islandGroup.add(waterRing);

      // 4. Centerpiece Blooming Sakura Tree (Scale: 1.8)
      const mainSakura = createSakuraTree(1.8);
      mainSakura.position.set(0, 0.5, 0);
      islandGroup.add(mainSakura);

      // 5. Grove of 12 Secondary Sakura Trees inside the island perimeter
      for (let i = 0; i < 12; i++) {
        const treeScale = 0.75 + Math.random() * 0.5;
        const tree = createSakuraTree(treeScale);
        const angle = Math.random() * Math.PI * 2;
        const radius = 4.5 + Math.random() * 8.5; // Confined strictly within island turf

        tree.position.set(Math.cos(angle) * radius, 0.5, Math.sin(angle) * radius);
        tree.rotation.y = Math.random() * Math.PI * 2;
        islandGroup.add(tree);
      }

      scene.add(islandGroup);
    }

    /**
     * Patch 4: Sakura Tree Generator
     * Stylized organic trunk with curved inclination and blossoming pink canopies.
     */
    function createSakuraTree(scale = 1) {
      const treeGroup = new THREE.Group();

      // Slender curved trunk
      const trunkHeight = 6 * scale;
      const trunkGeo = new THREE.CylinderGeometry(0.3 * scale, 0.8 * scale, trunkHeight, 6);
      const trunkMat = new THREE.MeshStandardMaterial({
        color: 0x4a2c2a,
        roughness: 0.8,
        flatShading: true
      });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = trunkHeight / 2;
      trunk.rotation.z = (Math.random() - 0.5) * 0.22;
      trunk.rotation.x = (Math.random() - 0.5) * 0.15;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      treeGroup.add(trunk);

      // Blooming pink cherry blossom foliage clusters
      const leafMat = new THREE.MeshStandardMaterial({
        color: 0xffb7c5,          // Delicate cherry blossom pink
        roughness: 0.6,
        flatShading: true,
        emissive: 0x331122,       // Subtle warm internal glow for bloom catching
        emissiveIntensity: 0.3
      });

      const numLeafClusters = 6 + Math.floor(Math.random() * 4);
      for (let i = 0; i < numLeafClusters; i++) {
        const leafGeo = new THREE.IcosahedronGeometry((1.2 + Math.random() * 1.2) * scale, 1);
        const leaves = new THREE.Mesh(leafGeo, leafMat);

        const angle = (i / numLeafClusters) * Math.PI * 2 + Math.random();
        const dist = Math.random() * 2 * scale;

        leaves.position.set(
          Math.cos(angle) * dist,
          trunkHeight - (Math.random() * 2.5 * scale),
          Math.sin(angle) * dist
        );
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        treeGroup.add(leaves);
      }

      return treeGroup;
    }

    /**
     * Island Ground Details: Weathered low-poly stones and grass tufts on the island plateau
     */
    function createIslandDetails() {
      // 1. Stones scattered across the island grass
      const rockMaterial = new THREE.MeshStandardMaterial({
        color: 0x353040,
        roughness: 0.9,
        flatShading: true
      });

      const rockCount = 28;
      for (let i = 0; i < rockCount; i++) {
        const radius = 0.2 + Math.random() * 0.5;
        const rockGeo = new THREE.DodecahedronGeometry(radius, 0);
        const rock = new THREE.Mesh(rockGeo, rockMaterial);

        const angle = Math.random() * Math.PI * 2;
        const dist = 1.5 + Math.random() * 12.0;

        rock.position.set(
          Math.cos(angle) * dist,
          0.5 + radius * 0.3,
          Math.sin(angle) * dist
        );
        rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        rock.castShadow = true;
        rock.receiveShadow = true;
        islandGroup.add(rock);
      }

      // 2. Wild Grass Tufts on island
      const grassBladeMat = new THREE.MeshStandardMaterial({
        color: 0x3aa56d,
        roughness: 0.8,
        side: THREE.DoubleSide,
        flatShading: true
      });

      const tuftCount = 35;
      for (let i = 0; i < tuftCount; i++) {
        const tuft = new THREE.Group();
        const blades = 3 + Math.floor(Math.random() * 3);
        const tuftHeight = 0.35 + Math.random() * 0.35;
        const tuftWidth = 0.1 + Math.random() * 0.06;

        for (let b = 0; b < blades; b++) {
          const bladeGeo = new THREE.PlaneGeometry(tuftWidth, tuftHeight);
          bladeGeo.translate(0, tuftHeight / 2, 0);

          const blade = new THREE.Mesh(bladeGeo, grassBladeMat);
          blade.rotation.y = (b / blades) * Math.PI;
          blade.rotation.x = (Math.random() - 0.5) * 0.2;
          blade.castShadow = true;
          tuft.add(blade);
        }

        const dist = 1.8 + Math.random() * 11.5;
        const angle = Math.random() * Math.PI * 2;
        tuft.position.set(Math.cos(angle) * dist, 0.5, Math.sin(angle) * dist);
        islandGroup.add(tuft);
      }
    }

    /**
     * Glow Texture Generator for Additive Particles
     */
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const context = canvas.getContext('2d');
      const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.25, 'rgba(255, 220, 180, 0.85)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    /**
     * Bioluminescent Mushrooms & Fireflies (Constrained to Floating Island Volume)
     */
    function setupMushroomsAndFireflies() {
      // 1. Bioluminescent Cyan Mushrooms clustered near the main sakura roots
      const mushroomGroup = new THREE.Group();
      const mushroomMat = new THREE.MeshStandardMaterial({
        color: 0x00ffcc,
        emissive: 0x00ffcc,
        emissiveIntensity: 2.5,
        roughness: 0.4
      });
      const mushroomStemMat = new THREE.MeshStandardMaterial({
        color: 0x2a3b40,
        roughness: 0.8
      });

      for (let i = 0; i < 15; i++) {
        const mush = new THREE.Group();
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.07, 0.28, 6), mushroomStemMat);
        stem.position.y = 0.14;

        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.14, 6, 4, 0, Math.PI * 2, 0, Math.PI / 2), mushroomMat);
        cap.position.y = 0.28;

        mush.add(stem);
        mush.add(cap);

        const angle = Math.random() * Math.PI * 2;
        const radius = 1.5 + Math.random() * 3.5;
        mush.position.set(Math.cos(angle) * radius, 0.5, Math.sin(angle) * radius);
        mush.rotation.y = Math.random() * Math.PI;
        mushroomGroup.add(mush);
      }
      islandGroup.add(mushroomGroup);

      // 2. Firefly Particle System (300 particles floating over the island plateau)
      fireflyCount = 300;
      fireflyGeo = new THREE.BufferGeometry();
      const fireflyPositions = new Float32Array(fireflyCount * 3);
      const fireflyColors = new Float32Array(fireflyCount * 3);
      fireflyData = [];

      for (let i = 0; i < fireflyCount; i++) {
        // Confined across island radius (up to 15.5 units)
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 15.5;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const y = 0.8 + Math.random() * 7.5; // Hovering above island turf

        fireflyPositions[i * 3] = x;
        fireflyPositions[i * 3 + 1] = y;
        fireflyPositions[i * 3 + 2] = z;

        // Vivid glowing spectrum (golden-amber, soft rose, fairy cyan)
        const hue = (Math.random() < 0.4)
          ? 0.92 + Math.random() * 0.08  // Rose / pink
          : 0.12 + Math.random() * 0.25; // Warm gold to cyan
        const color = new THREE.Color().setHSL(hue, 1.0, 0.65);

        fireflyColors[i * 3] = color.r;
        fireflyColors[i * 3 + 1] = color.g;
        fireflyColors[i * 3 + 2] = color.b;

        fireflyData.push({
          speed: 0.5 + Math.random(),
          phaseX: Math.random() * Math.PI * 2,
          phaseY: Math.random() * Math.PI * 2,
          phaseZ: Math.random() * Math.PI * 2
        });
      }

      fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPositions, 3));
      fireflyGeo.setAttribute('color', new THREE.BufferAttribute(fireflyColors, 3));

      fireflyMat = new THREE.PointsMaterial({
        size: 1.25,
        map: createGlowTexture(),
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      fireflies = new THREE.Points(fireflyGeo, fireflyMat);
      scene.add(fireflies);
    }

    /**
     * Viewport Resize Event Handler
     */
    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      if (composer) {
        composer.setSize(width, height);
      }
    }

    /**
     * Main Animation Loop
     */
    function animate() {
      requestAnimationFrame(animate);

      // Smooth camera orbit
      controls.update();

      const time = Date.now() * 0.001;

      // Pulse fireflies glow
      if (fireflyMat) {
        fireflyMat.opacity = 0.6 + Math.sin(time * 3) * 0.4;
      }

      // Harmonic kinematic firefly drift (kept over the floating island)
      if (fireflies && fireflyData && fireflyData.length) {
        const positions = fireflies.geometry.attributes.position.array;

        for (let i = 0; i < fireflyCount; i++) {
          const data = fireflyData[i];
          const i3 = i * 3;

          positions[i3] += Math.sin(time * data.speed + data.phaseX) * 0.02;
          positions[i3 + 1] += Math.cos(time * data.speed * 0.8 + data.phaseY) * 0.02;
          positions[i3 + 2] += Math.sin(time * data.speed * 1.2 + data.phaseZ) * 0.02;

          // Boundary containment: keep over the floating island (radius 16)
          const distXZ = Math.sqrt(positions[i3] * positions[i3] + positions[i3 + 2] * positions[i3 + 2]);
          if (distXZ > 16.0) {
            positions[i3] *= 0.985;
            positions[i3 + 2] *= 0.985;
          }
          if (positions[i3 + 1] > 10.0) positions[i3 + 1] *= 0.99;
          if (positions[i3 + 1] < 0.6) positions[i3 + 1] = 0.6 + Math.random();
        }

        fireflies.geometry.attributes.position.needsUpdate = true;
      }

      // Render through Bloom Post-processing
      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    // Launch scene on DOM load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
