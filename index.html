<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Floating Island | Three.js Diorama</title>
  <style>
    /* Full-viewport reset and clean canvas presentation */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060d20;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      outline: none;
    }
    .night-audio-controls {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: max(16px, env(safe-area-inset-left));
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 12px 4px 4px;
      border: 1px solid rgba(174, 214, 231, 0.25);
      border-radius: 24px;
      background: rgba(7, 19, 34, 0.82);
    }
    .night-audio-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 112px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 22px;
      background: transparent;
      color: #c8dce6;
      font: 13px system-ui, sans-serif;
      cursor: pointer;
    }
    .night-audio-volume { width: 80px; min-height: 44px; accent-color: #85c9bf; cursor: pointer; }
    .night-audio-volume:focus-visible { outline: 2px solid #9fe5df; border-radius: 8px; }
    @media (max-width: 480px) {
      .night-audio-controls { left: 10px; bottom: max(10px, env(safe-area-inset-bottom)); gap: 4px; }
      .night-audio-volume { width: 64px; }
    }
    .night-audio-toggle:focus-visible { outline: 2px solid #9fe5df; outline-offset: 3px; }
    .night-audio-toggle[aria-pressed="true"] { border-color: #85c9bf; }
    .night-audio-toggle:disabled { opacity: 0.6; cursor: wait; }
    .sky-sign { position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
      color: #c0ebdf; font: 12px system-ui, sans-serif; letter-spacing: 0.24em;
      text-transform: uppercase; pointer-events: none; opacity: 0;
      will-change: opacity, filter;
      text-shadow: 0 1px 12px #3d8c8b; }
  </style>

  <!-- Three.js & OrbitControls via CDN Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Clean, full-screen WebGL viewport without UI overlay -->
  <canvas id="webgl-canvas"></canvas>
  <output id="sky-sign" class="sky-sign" aria-live="polite"></output>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { makeForestDetails } from './forest-details.js?v=mobile-20261025';
    import { createZodiacPatterns } from './swarm-patterns.js';
    import { createTreeAvoidance } from './firefly-avoidance.js?v=mobile-20261025';
    import { createCosmicSky } from './cosmic-sky.js?v=blackhole-20261025';
    import { createBlackHole, captureBlackHoleSky } from './black-hole.js?v=blackhole-20261025';
    const details = makeForestDetails(THREE);
    const treeAvoidance = createTreeAvoidance(THREE);

    /**
     * Application Singletons & State
     */
    let scene, camera, renderer, controls, composer, bloomPass, accretionDisk, skyStars;
    let nextShadowFrame = 0;
    let islandGroup;
    let fireflyCount, fireflyGeo, fireflyData, fireflies, fireflyMat;
    const clock = new THREE.Clock();
    const mistLayers = [], crowns = [];
    let waterSurface, waterRestPositions;
    const islandOutline = (angle) => 17.6 + Math.sin(angle * 3 + 0.4) * 0.65
      + Math.sin(angle * 7) * 0.38 + Math.cos(angle * 11) * 0.22;
    const pointer = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();
    const hoverPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -3);
    const cursorWorld = new THREE.Vector3();
    let pointerActive = false;
    const compactDevice = matchMedia('(pointer: coarse)').matches || innerWidth < 700;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const quality = { pixelRatio: Math.min(devicePixelRatio, compactDevice ? 1.25 : 1.75),
      fireflies: compactDevice ? 180 : 300, stars: compactDevice ? 800 : 1400,
      petals: compactDevice ? 55 : 100 };
    const driftingRocks = [], petalData = [];
    const koi = [], lilyPads = [], frogs = [], waterRipples = [];
    const swarmCount = compactDevice ? 100 : 170;
    const swarmColor = new THREE.Color(0xbdffe8);
    const swarmCenter = new THREE.Vector3(0, 19.3, 0);
    const swarmTarget = new THREE.Vector3();
    const fishPoints = new Float32Array(swarmCount * 2);
    for (let i = 0; i < swarmCount; i++) {
      const point = fishFigurePoint(i, swarmCount);
      fishPoints[i * 2] = point.x; fishPoints[i * 2 + 1] = point.y;
    }
    const swarmPatterns = [{ name: 'Koi', points: fishPoints }, ...createZodiacPatterns(swarmCount)];
    let skyLabel, moonLight, cosmicSky, ceremonyLight;
    let captionKey = '';
    let waterEnvironmentTarget;
    let petals, owlHead, owlEyes, waterFrame = 0;
    const owlWings = [];
    let owlTorso, moon;
    const audioForward = new THREE.Vector3(), audioUp = new THREE.Vector3();
    let nextAudioFrame = 0;
    let cameraHeld = false, cameraResumeAt = 0;
    const overviewTarget = new THREE.Vector3(0, 1, 0);
    let overviewRadius = 56, overviewTheta = Math.PI / 4;
    let returnToOverview = false, cameraReturn = null;
    let overviewPolar = 1.08, zoomReturnPose = null, gestureStartView = null, inspectionAnchor = null;
    let frameSum = 0, frameSamples = 0, qualityAdjusted = false;
    const orbitOffset = new THREE.Vector3();
    const orbitSpherical = new THREE.Spherical();

    /**
     * Entry Point: Initialize WebGL environment, lighting, geometry, and controls
     */
    async function init() {
      const canvas = document.getElementById('webgl-canvas');
      const stage = name => {
        canvas.dataset.initStage = name;
        if (new URLSearchParams(location.search).has('renderCheck')) console.info('scene-stage', name);
      };
      stage('scene');
      skyLabel = document.getElementById('sky-sign');

      // 1. Night sky and atmospheric depth
      scene = new THREE.Scene();
      setupNightSky();
      moon = details.createMoon(compactDevice ? 2 : 4);
      moon.update(0);
      scene.add(moon.mesh);
      scene.fog = new THREE.FogExp2(0x101e36, 0.009);

      // 2. Camera Setup (Patch 4: Isometric angle overlooking the diorama)
      const aspect = window.innerWidth / window.innerHeight;
      camera = new THREE.PerspectiveCamera(aspect < 1 ? 50 : 45, aspect, 0.2, 900);
      overviewRadius = Math.max(56, 29 / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * aspect));
      const framing = overviewRadius / Math.hypot(36, 23, 36);
      camera.position.set(36 * framing, 1 + 23 * framing, 36 * framing);
      if (compactDevice) scene.fog.density *= Math.min(1, 56 / overviewRadius);

      // 3. Renderer with ACES Filmic Tone Mapping & Soft Shadows
      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(quality.pixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05; // Balanced exposure to prevent white clipping
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.shadowMap.autoUpdate = !compactDevice;
      stage('renderer');

      // 4. OrbitControls Setup (Patch 4: Centered isometric rotation)
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1, 0);
      controls.autoRotate = false; // The cinematic orbit below also varies elevation.
      controls.autoRotateSpeed = 0.5; // Slow, majestic diorama rotation
      controls.maxPolarAngle = Math.PI / 2.2; // Keep camera above horizon
      controls.minDistance = 10;
      controls.maxDistance = 180;
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      camera.lookAt(controls.target);
      if (new URLSearchParams(location.search).get('blackhole') !== '0') {
        const environment = captureBlackHoleSky(THREE, renderer, cosmicSky.backdrop, skyStars, compactDevice);
        accretionDisk = createBlackHole(THREE, { compact: compactDevice, environment });
        accretionDisk.place(camera);
        scene.add(accretionDisk.mesh);
      }
      controls.addEventListener('start', () => {
        cameraHeld = true;
        gestureStartView = snapshotCamera();
        cameraReturn = null;
        inspectionAnchor = null;
      });
      controls.addEventListener('change', () => {
        if (cameraHeld && gestureStartView && !zoomReturnPose
          && Math.abs(camera.position.distanceTo(controls.target) - gestureStartView.spherical.radius) > 0.02) {
          zoomReturnPose = gestureStartView;
          returnToOverview = true;
        }
      });
      controls.addEventListener('end', () => {
        cameraHeld = false;
        cameraResumeAt = performance.now() + 5000;
        cameraReturn = null;
        inspectionAnchor = { ...snapshotCamera(), started: performance.now() };
        if (!zoomReturnPose) {
          overviewTarget.copy(controls.target);
          orbitOffset.copy(camera.position).sub(controls.target);
          orbitSpherical.setFromVector3(orbitOffset);
          overviewTheta = orbitSpherical.theta; overviewRadius = orbitSpherical.radius;
          overviewPolar = orbitSpherical.phi - Math.sin(clock.elapsedTime * 0.08) * 0.035;
          returnToOverview = false;
        }
      });
      canvas.addEventListener('wheel', () => {
        if (!zoomReturnPose) zoomReturnPose = snapshotCamera();
        returnToOverview = true;
      }, { capture: true, passive: true });

      // 5. Build Diorama Entities
      setupLighting();
      createFloatingIsland();
      createIslandDetails();
      setupMushroomsAndFireflies();
      createGroundMist();
      createIslandLife();
      createPondLife();
      stage('entities');
      details.setAnisotropy(Math.min(compactDevice ? 4 : 8, renderer.capabilities.getMaxAnisotropy()));
      captureWaterReflections();
      stage('reflections');

      // 6. Post-processing Pipeline: UnrealBloomPass & OutputPass (Calibrated for crisp diorama)
      const renderScene = new RenderPass(scene, camera);
      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.7,
        0.5,
        1.0 // HDR fireflies and mushrooms bloom; ordinary surfaces stay crisp
      );
      const outputPass = new OutputPass();

      composer = new EffectComposer(renderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);
      composer.addPass(outputPass);
      resizeMobileBloom();
      stage('postprocessing');

      // 7. Responsive Resize Handling
      window.addEventListener('resize', onWindowResize, false);
      canvas.addEventListener('pointermove', (event) => {
        if (event.pointerType === 'touch') return;
        const rect = canvas.getBoundingClientRect();
        pointer.set((event.clientX - rect.left) / rect.width * 2 - 1,
          -(event.clientY - rect.top) / rect.height * 2 + 1);
        pointerActive = true;
        if (returnToOverview && !cameraHeld) {
          cameraResumeAt = performance.now() + 5000;
          cameraReturn = null;
        }
      });
      canvas.addEventListener('pointerleave', () => { pointerActive = false; });
      window.addEventListener('blur', () => { pointerActive = false; });

      // Compile materials before interaction, including meshes first revealed by zoom.
      stage('shader-warmup');
      await renderer.compileAsync(scene, camera);
      // Upload geometry outside the first view too, so the first zoom does not do it.
      const culling = [];
      scene.traverse(object => {
        if (object.geometry) { culling.push([object, object.frustumCulled]); object.frustumCulled = false; }
      });
      try {
        renderer.shadowMap.needsUpdate = true;
        composer.render();
      } finally {
        for (const [object, enabled] of culling) object.frustumCulled = enabled;
      }
      if (compactDevice) nextShadowFrame = 0.1;

      // 8. Start Render Loop
      animate();
      canvas.dataset.sceneReady = 'true';
      stage('ready');
    }

    /**
     * Deep blue procedural sky with a separate distant star field.
     */
    function setupNightSky() {
      scene.background = new THREE.Color(0x0b1021);
      cosmicSky = createCosmicSky(THREE, reducedMotion);
      scene.add(cosmicSky.mesh);
      const positions = [], colors = [];
      for (let i = 0; i < quality.stars; i++) {
        const azimuth = Math.random() * Math.PI * 2;
        const elevation = Math.random();
        const ring = Math.sqrt(1 - elevation * elevation);
        positions.push(240 * ring * Math.cos(azimuth), 240 * elevation,
          240 * ring * Math.sin(azimuth));
        const brightness = 0.25 + Math.random() * 0.55;
        colors.push(brightness * 0.8, brightness * 0.9, brightness);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      const stars = new THREE.Points(geometry, new THREE.PointsMaterial({
        size: 0.36, vertexColors: true, transparent: true, opacity: 0.85,
        fog: false, depthWrite: false
      }));
      stars.renderOrder = -4;
      skyStars = stars;
      scene.add(stars);
    }

    /**
     * Cool moonlight, readable blue fill and restrained bioluminescence.
     */
    function setupLighting() {
      // 1. Blue sky fill
      const ambientLight = new THREE.HemisphereLight(0x8baee8, compactDevice ? 0x35445b : 0x283449,
        compactDevice ? 0.95 : 0.85);
      scene.add(ambientLight);

      // 2. Moonlight and soft directional shadows
      const sunsetLight = new THREE.DirectionalLight(0xb8d7ff, 2.2);
      moonLight = sunsetLight;
      sunsetLight.position.set(-18, 24, -16);
      sunsetLight.castShadow = true;
      sunsetLight.shadow.mapSize.width = compactDevice ? 1024 : 2048;
      sunsetLight.shadow.mapSize.height = compactDevice ? 1024 : 2048;
      sunsetLight.shadow.camera.near = 0.5;
      sunsetLight.shadow.camera.far = 80;
      sunsetLight.shadow.camera.left = -25;
      sunsetLight.shadow.camera.right = 25;
      sunsetLight.shadow.camera.top = 25;
      sunsetLight.shadow.camera.bottom = -25;
      sunsetLight.shadow.bias = -0.0004;
      sunsetLight.shadow.radius = 2.0;
      scene.add(sunsetLight);
      const fillLight = new THREE.DirectionalLight(0x768bc4, compactDevice ? 0.55 : 0.45);
      fillLight.position.set(15, 10, 20);
      scene.add(fillLight);
      const rockRim = new THREE.DirectionalLight(0x759fe0, 0.65);
      rockRim.position.set(12, -9, -16);
      scene.add(rockRim);
      const amberRim = new THREE.DirectionalLight(0xe5a267, 0.65);
      amberRim.position.set(-24, -7, -15);
      amberRim.target.position.set(0, -1, 0);
      scene.add(amberRim, amberRim.target);
      ceremonyLight = new THREE.DirectionalLight(0xa7dcd8, 0);
      ceremonyLight.position.set(0, 24, 3);
      scene.add(ceremonyLight);

      // 3. Subtle turquoise water glow reflecting from underneath
      const waterLight = new THREE.PointLight(0x00d8f0, 1.2, 16);
      waterLight.position.set(0, -2, 0);
      scene.add(waterLight);

      // 4. Warm subtle glow near central tree roots
      const rootGlow = new THREE.PointLight(0xffaa55, 1.2, 8);
      rootGlow.position.set(0, 1.2, 0);
      scene.add(rootGlow);
    }

    /**
     * Patch 4: Floating Island Construction
     * Inverted rocky cone base, mossy green plateau top, glowing water ring, and sakura grove.
     */
    function createFloatingIsland() {
      islandGroup = new THREE.Group();

      // Shared irregular outline keeps the soil and exposed rock joined.
      const segments = 40;
      const outline = islandOutline;
      const vertices = [], indices = [];
      const rings = [[1, -0.4], [0.97, -2.1], [0.73, -5.3], [0.39, -8.2], [0.08, -10.2]];
      rings.forEach(([scale, height], ring) => {
        for (let i = 0; i < segments; i++) {
          const angle = i / segments * Math.PI * 2;
          const radius = outline(angle) * scale * (1 + (ring ? Math.sin(i * 5.7 + ring) * 0.09 : 0));
          vertices.push(Math.cos(angle) * radius + ring * 0.38,
            height + (ring ? Math.sin(i * 2.3 + ring * 1.7) * 0.65 : 0),
            Math.sin(angle) * radius - ring * 0.22);
          if (ring < rings.length - 1) {
            const a = ring * segments + i, b = ring * segments + (i + 1) % segments;
            indices.push(a, b, a + segments, b, b + segments, a + segments);
          }
        }
      });
      vertices.push(1.6, -11.4, -0.9);
      const tip = vertices.length / 3 - 1;
      for (let i = 0; i < segments; i++) {
        const start = (rings.length - 1) * segments;
        indices.push(start + i, start + (i + 1) % segments, tip);
      }
      const rockGeo = new THREE.BufferGeometry();
      rockGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      rockGeo.setIndex(indices);
      rockGeo.computeVertexNormals();
      const rockMat = new THREE.MeshStandardMaterial({
        color: 0x414658,
        roughness: 0.9,
        flatShading: true
      });
      const rockBase = new THREE.Mesh(rockGeo, rockMat);
      rockBase.receiveShadow = true;
      rockBase.castShadow = true;
      islandGroup.add(rockBase);
      // Small embedded shards break up the lower silhouette.
      for (let i = 0; i < 9; i++) {
        const angle = i * 2.39996;
        const length = 1.4 + Math.random() * 2.4;
        const shard = new THREE.Mesh(new THREE.ConeGeometry(1.1 + Math.random(), length, 5), rockMat);
        shard.rotation.set(Math.PI + Math.sin(angle) * 0.18, angle, Math.cos(angle) * 0.2);
        shard.position.set(Math.cos(angle) * 8, -5.1 - length * 0.25, Math.sin(angle) * 8);
        shard.castShadow = shard.receiveShadow = true;
        islandGroup.add(shard);
      }

      // 2. Lush Grass Plateau (Top of the island)
      const grassGeo = new THREE.CylinderGeometry(1, 1, 0.9, segments, 1, true);
      const soilPositions = grassGeo.attributes.position;
      const soilColors = [];
      const moss = new THREE.Color(0x386b54), earth = new THREE.Color(0x454038);
      for (let i = 0; i < soilPositions.count; i++) {
        const x = soilPositions.getX(i), z = soilPositions.getZ(i);
        const angle = Math.atan2(z, x);
        const radius = outline(angle);
        soilPositions.setXYZ(i, x * radius, soilPositions.getY(i), z * radius);
        const tint = (soilPositions.getY(i) > 0 ? moss : earth).clone();
        tint.multiplyScalar(0.85 + 0.15 * Math.sin(angle * 9));
        soilColors.push(tint.r, tint.g, tint.b);
      }
      grassGeo.setAttribute('color', new THREE.Float32BufferAttribute(soilColors, 3));
      grassGeo.computeVertexNormals();
      const grassMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        map: details.surfaceTexture('soil'),
        bumpMap: details.surfaceTexture('soil'),
        bumpScale: 0.055,
        roughness: 0.95,
        flatShading: true
      });
      const grassTop = new THREE.Mesh(grassGeo, grassMat);
      grassTop.position.y = 0;
      grassTop.receiveShadow = true;
      islandGroup.add(grassTop);
      // A real shallow channel beneath the water, with raised irregular shores.
      const terrainGeo = new THREE.RingGeometry(0, 1, segments, 28);
      terrainGeo.rotateX(-Math.PI / 2);
      const terrainPositions = terrainGeo.attributes.position;
      const terrainColors = [];
      for (let i = 0; i < terrainPositions.count; i++) {
        const x = terrainPositions.getX(i), z = terrainPositions.getZ(i);
        const angle = Math.atan2(z, x), shore = outline(angle);
        const radius = Math.hypot(x, z) * shore;
        const channel = THREE.MathUtils.smoothstep(radius, 13.65, 14.35)
          * (1 - THREE.MathUtils.smoothstep(radius, shore - 0.9, shore - 0.2));
        terrainPositions.setXYZ(i, x * shore, 0.45 - channel * 0.8, z * shore);
        const tint = moss.clone().lerp(earth, channel * 0.8);
        tint.multiplyScalar(0.9 + Math.sin(x * 23 + z * 17) * 0.1);
        terrainColors.push(tint.r, tint.g, tint.b);
      }
      terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(terrainColors, 3));
      terrainGeo.computeVertexNormals();
      const terrain = new THREE.Mesh(terrainGeo, grassMat);
      terrain.receiveShadow = true;
      islandGroup.add(terrain);
      // Uneven moss cushions along the shore, clear of the water channel.
      const mossMat = new THREE.MeshStandardMaterial({ color: 0x315d48, roughness: 1, flatShading: true });
      for (let i = 0; i < 24; i++) {
        const angle = i * 2.39996;
        const patch = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), mossMat);
        const radius = i % 2 ? 13.3 : outline(angle) - 0.4;
        patch.position.set(Math.cos(angle) * radius, 0.5, Math.sin(angle) * radius);
        patch.scale.set(0.7 + Math.random() * 0.5, 0.15 + Math.random() * 0.2, 0.6 + Math.random() * 0.5);
        patch.receiveShadow = true;
        islandGroup.add(patch);
      }

      // 3. Luminous Turquoise Water Ring (Balanced soft glow)
      const waterGeo = new THREE.RingGeometry(14, 16.7, compactDevice ? 112 : 160, compactDevice ? 12 : 16);
      waterGeo.rotateX(-Math.PI / 2);
      const waterPositions = waterGeo.attributes.position;
      for (let i = 0; i < waterPositions.count; i++) {
        const x = waterPositions.getX(i), z = waterPositions.getZ(i);
        const radius = Math.hypot(x, z);
        const angle = Math.atan2(z, x);
        const shoreRadius = 14 + (radius - 14) / 2.7 * (outline(angle) - 0.7 - 14);
        waterPositions.setXYZ(i, x * shoreRadius / radius, 0, z * shoreRadius / radius);
      }
      waterGeo.computeVertexNormals();
      const waterMat = new THREE.MeshPhysicalMaterial({
        color: 0x39858e,
        roughness: 0.16,
        normalMap: createWaterNormals(),
        normalScale: new THREE.Vector2(0.22, 0.22),
        clearcoatNormalMap: createWaterNormals(),
        clearcoatNormalScale: new THREE.Vector2(0.12, 0.12),
        metalness: 0,
        clearcoat: 1,
        clearcoatRoughness: 0.12,
        ior: 1.333,
        transparent: true,
        opacity: 0.57,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const waterRing = new THREE.Mesh(waterGeo, waterMat);
      waterMat.clearcoatNormalMap.repeat.set(9, 9);
      waterRing.position.y = 0.64;
      waterRing.receiveShadow = true;
      waterSurface = waterRing;
      waterRestPositions = waterGeo.attributes.position.array.slice();
      islandGroup.add(waterRing);

      // 4. Centerpiece Blooming Sakura Tree (Scale: 1.8)
      const mainSakura = createSakuraTree(1.8);
      mainSakura.position.set(0, 0.5, 0);
      islandGroup.add(mainSakura);

      // Loose asymmetric grove with a foreground clearing and guaranteed spacing.
      const grove = [[-9, -6], [-2, -11], [6, -9], [11, -2],
        [-11, 2], [-6, 9], [5, 10]];
      for (let i = 0; i < grove.length; i++) {
        const treeScale = 0.68 + Math.random() * 0.27;
        const tree = createSakuraTree(treeScale);
        tree.position.set(grove[i][0], 0.5, grove[i][1]);
        tree.rotation.y = Math.random() * Math.PI * 2;
        islandGroup.add(tree);
      }

      scene.add(islandGroup);
    }

    /**
     * Patch 4: Sakura Tree Generator
     * Stylized organic trunk with curved inclination and blossoming pink canopies.
     */
    function createSakuraTree(scale = 1) {
      const treeGroup = new THREE.Group();

      // Slender curved trunk
      const trunkHeight = 6 * scale;
      const visibleTrunkHeight = trunkHeight * 0.82;
      const trunkGeo = new THREE.CylinderGeometry(0.25 * scale, 0.8 * scale, visibleTrunkHeight, 6);
      const trunkMat = new THREE.MeshStandardMaterial({
        color: 0x4a2c2a,
        map: details.surfaceTexture('bark'),
        bumpMap: details.surfaceTexture('bark'),
        bumpScale: 0.035,
        roughness: 0.92,
        flatShading: true
      });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.name = 'sakura-trunk';
      trunk.position.y = visibleTrunkHeight / 2;
      trunk.rotation.z = (Math.random() - 0.5) * 0.22;
      trunk.rotation.x = (Math.random() - 0.5) * 0.15;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      treeGroup.add(trunk);
      treeAvoidance.addTrunk(trunk, visibleTrunkHeight, 0.8 * scale, 0.25 * scale);

      // Blooming pink cherry blossom foliage clusters
      const leafMat = new THREE.MeshStandardMaterial({
        color: 0xffb7c5,          // Delicate cherry blossom pink
        map: details.surfaceTexture('leaves'),
        roughness: 0.9,
        flatShading: false,
        emissive: 0x331122,       // Subtle warm internal glow for bloom catching
        emissiveIntensity: 0.04
      });

      const numLeafClusters = 6 + Math.floor(Math.random() * 4);
      for (let i = 0; i < numLeafClusters; i++) {
        const leafGeo = new THREE.IcosahedronGeometry((1.2 + Math.random() * 1.2) * scale, compactDevice ? 1 : 2);
        const vertices = leafGeo.attributes.position;
        for (let v = 0; v < vertices.count; v++) {
          const x = vertices.getX(v), y = vertices.getY(v), z = vertices.getZ(v);
          const variation = 1 + Math.sin(x * 3.1 + y * 2.3) * Math.cos(z * 3.4) * 0.03;
          vertices.setXYZ(v, x * variation, y * variation, z * variation);
        }
        leafGeo.computeVertexNormals();
        const normals = leafGeo.attributes.normal;
        for (let v = 0; v < vertices.count; v++) {
          const x = vertices.getX(v), y = vertices.getY(v), z = vertices.getZ(v);
          const length = Math.hypot(x, y, z);
          normals.setXYZ(v, x / length, y / length, z / length);
        }
        const leaves = new THREE.Mesh(leafGeo, leafMat);

        const angle = (i / numLeafClusters) * Math.PI * 2 + Math.random();
        const dist = Math.random() * 2 * scale;

        leaves.position.set(
          Math.cos(angle) * dist,
          trunkHeight - (Math.random() * 2.5 * scale),
          Math.sin(angle) * dist
        );
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        treeGroup.add(leaves);
        treeAvoidance.addCanopy(leaves);
        crowns.push({ mesh: leaves, rest: leaves.position.clone(),
          phase: Math.random() * Math.PI * 2, amplitude: 0.06 * scale });
      }

      // An interior foliage core covers the trunk tip even between swaying clusters.
      const canopyCore = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1 * scale, 1), leafMat);
      canopyCore.name = 'sakura-canopy-core';
      canopyCore.position.y = trunkHeight * 0.87;
      canopyCore.castShadow = canopyCore.receiveShadow = true;
      treeGroup.add(canopyCore);
      treeAvoidance.addCanopy(canopyCore);
      return treeGroup;
    }

    /**

    /**
     * Glow Texture Generator for Additive Particles
     */
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const context = canvas.getContext('2d');
      const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.25, 'rgba(255, 220, 180, 0.85)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    function createWaterNormals() {
      const size = 128, pixels = new Uint8Array(size * size * 4);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size * Math.PI * 2, v = y / size * Math.PI * 2;
          const dx = Math.cos(u * 5 + v * 3) * 0.32 + Math.cos(u * 11 - v * 7) * 0.13;
          const dy = Math.cos(u * 5 + v * 3) * 0.19 - Math.cos(u * 11 - v * 7) * 0.08;
          const length = Math.hypot(dx, dy, 1), index = (y * size + x) * 4;
          pixels[index] = Math.round((dx / length * 0.5 + 0.5) * 255);
          pixels[index + 1] = Math.round((dy / length * 0.5 + 0.5) * 255);
          pixels[index + 2] = Math.round((1 / length * 0.5 + 0.5) * 255);
          pixels[index + 3] = 255;
        }
      }
      const texture = new THREE.DataTexture(pixels, size, size, THREE.RGBAFormat);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.magFilter = texture.minFilter = THREE.LinearFilter;
      texture.repeat.set(5, 5);
      texture.needsUpdate = true;
      return texture;
    }

    function createIslandLife() {
      const bark = new THREE.MeshStandardMaterial({ color: 0x493c40, roughness: 0.95, flatShading: true });
      const vineMaterial = new THREE.MeshStandardMaterial({ color: 0x3e6654, roughness: 1 });
      const leafMaterial = new THREE.MeshStandardMaterial({ color: 0x46785d, roughness: 0.95, flatShading: true });
      const leafGeometry = new THREE.IcosahedronGeometry(0.16, 0);
      const addCurve = (points, radius, material, segments = 16, taper = false) => {
        const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
        const geometry = new THREE.TubeGeometry(curve, segments, radius, 5, false);
        if (taper) {
          const position = geometry.attributes.position;
          for (let i = 0; i <= segments; i++) {
            const center = curve.getPointAt(i / segments);
            const width = Math.pow(1 - i / segments, 0.8) * 0.94 + 0.06;
            for (let j = 0; j <= 5; j++) {
              const index = i * 6 + j;
              const ridge = width * (0.92 + Math.sin(i * 1.7 + j * 2) * 0.08);
              position.setXYZ(index, center.x + (position.getX(index) - center.x) * ridge,
                center.y + (position.getY(index) - center.y) * ridge,
                center.z + (position.getZ(index) - center.z) * ridge);
            }
          }
          geometry.computeVertexNormals();
        }
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = mesh.receiveShadow = true;
        islandGroup.add(mesh);
        return curve;
      };
      for (let i = 0; i < 8; i++) {
        const angle = i * 2.39996;
        const c = Math.cos(angle), s = Math.sin(angle);
        const shore = islandOutline(angle);
        addCurve([[c * (shore - 0.55), 0.5, s * (shore - 0.55)],
          [c * (shore + 0.03), 0.1, s * (shore + 0.03)],
          [c * (shore - 0.3), -1.1, s * (shore - 0.3)],
          [c * (shore - 1.6), -2.5 - (i % 3) * 0.45, s * (shore - 1.6)]],
          0.2 + (i % 3) * 0.04, bark, 24, true);
        const branchAngle = angle + 0.035;
        addCurve([[c * (shore - 0.1), -0.65, s * (shore - 0.1)],
          [Math.cos(branchAngle) * (shore - 0.2), -1.4, Math.sin(branchAngle) * (shore - 0.2)],
          [Math.cos(branchAngle + 0.03) * (shore - 1.5), -2.1, Math.sin(branchAngle + 0.03) * (shore - 1.5)]],
          0.075, bark, 12, true);
      }
      const vineCount = compactDevice ? 36 : 58;
      const hangingLeafMaterial = leafMaterial.clone();
      hangingLeafMaterial.color.set(0xffffff);
      const vineLeaves = new THREE.InstancedMesh(leafGeometry, hangingLeafMaterial, vineCount * 28);
      const vineLeaf = new THREE.Object3D();
      const vineColors = [new THREE.Color(0x477c5b), new THREE.Color(0x315a47), new THREE.Color(0x5a8864)];
      let vineLeafIndex = 0;
      for (let i = 0; i < vineCount; i++) {
        const angle = i / vineCount * Math.PI * 2 + Math.sin(i * 1.7) * 0.08;
        const c = Math.cos(angle), s = Math.sin(angle);
        const shore = islandOutline(angle);
        const curve = addCurve([[c * (shore - 0.2), 0.4, s * (shore - 0.2)],
          [c * (shore + 0.1), -1.3, s * (shore + 0.1)],
          [c * (shore - 0.1), -3.6, s * (shore - 0.1)],
          [c * (shore - 0.5) + Math.sin(i) * 0.8, -3.8 - (i % 7) * 0.85, s * (shore - 0.5)]],
          0.026 + (i % 3) * 0.009, vineMaterial);
        const nodes = 8 + (i % 7);
        for (let j = 0; j < nodes; j++) {
          const point = curve.getPoint((j + 0.5) / nodes);
          for (const side of [-1, 1]) {
            vineLeaf.position.copy(point);
            vineLeaf.position.x += Math.cos(angle + Math.PI / 2) * side * 0.15 + c * 0.08;
            vineLeaf.position.z += Math.sin(angle + Math.PI / 2) * side * 0.15 + s * 0.08;
            vineLeaf.scale.set(1.6 + (i % 3) * 0.35, 0.45, 0.9);
            vineLeaf.rotation.set(0.35, -angle + side * 0.65, side * 0.35);
            vineLeaf.updateMatrix();
            vineLeaves.setMatrixAt(vineLeafIndex, vineLeaf.matrix);
            vineLeaves.setColorAt(vineLeafIndex++, vineColors[(i + j) % vineColors.length]);
          }
        }
      }
      vineLeaves.count = vineLeafIndex;
      vineLeaves.instanceMatrix.needsUpdate = true;
      vineLeaves.instanceColor.needsUpdate = true;
      vineLeaves.receiveShadow = true;
      islandGroup.add(vineLeaves);
      // Fern clusters use one instanced draw call to keep the undergrowth light.
      const fernCount = compactDevice ? 10 : 16;
      const fern = new THREE.InstancedMesh(leafGeometry, leafMaterial, fernCount * 5 * 6);
      const leaflet = new THREE.Object3D();
      let leafletIndex = 0;
      for (let i = 0; i < fernCount; i++) {
        const angle = i * 2.39996, radius = 9.5 + (i % 4) * 0.85;
        const x = Math.cos(angle) * radius, z = Math.sin(angle) * radius;
        for (let f = 0; f < 5; f++) {
          const direction = angle + f / 5 * Math.PI * 2;
          for (let j = 0; j < 6; j++) {
            const t = (j + 1) / 7, spread = t * 0.8;
            leaflet.position.set(x + Math.cos(direction) * spread, 0.5 + Math.sin(t * Math.PI * 0.85) * 0.65,
              z + Math.sin(direction) * spread);
            leaflet.rotation.set(0, -direction, (j % 2 ? 1 : -1) * 0.2);
            leaflet.scale.set(2.1 * (1 - t * 0.7), 0.3, 0.8);
            leaflet.updateMatrix();
            fern.setMatrixAt(leafletIndex++, leaflet.matrix);
          }
        }
      }
      fern.instanceMatrix.needsUpdate = true;
      fern.receiveShadow = true;
      islandGroup.add(fern);
      const floatingMaterial = new THREE.MeshStandardMaterial({ color: 0x454b61, roughness: 0.9, flatShading: true });
      const rockCount = compactDevice ? 14 : 23;
      for (let i = 0; i < rockCount; i++) {
        const angle = i * 2.39996 + 0.3;
        const size = i < 3 ? 2.1 + i * 0.55 : 0.35 + (i % 5) * 0.28;
        const orbitRadius = (i < 3 ? 23 : 20.5) + (i % 4) * 1.3;
        const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 0), floatingMaterial);
        rock.position.set(Math.cos(angle) * orbitRadius, -2.5 - (i % 8) * 1.15, Math.sin(angle) * orbitRadius);
        rock.scale.set(0.8 + (i % 3) * 0.2, 1.1 + (i % 4) * 0.2, 0.7 + (i % 2) * 0.25);
        rock.rotation.set(i * 0.7, angle, i * 0.3);
        rock.castShadow = rock.receiveShadow = true;
        driftingRocks.push({ mesh: rock, y: rock.position.y, phase: angle,
          radius: orbitRadius, speed: (i % 2 ? 1 : -1) * (0.005 + (i % 5) * 0.002),
          lift: i < 3 ? 0.55 : 0.8 + (i % 3) * 0.25 });
        islandGroup.add(rock);
      }

      // A small owl on a weathered perch in the foreground clearing.
      addCurve([[6.8, 0.45, 8], [6.7, 1.6, 8], [7, 2.8, 8], [7.2, 4, 8]], 0.23, bark);
      addCurve([[6.9, 2.5, 8], [7.8, 3.5, 8], [9.2, 3.7, 8]], 0.12, bark);
      const owl = new THREE.Group();
      owl.position.set(8.3, 3.65, 8);
      owl.rotation.y = 0.45;
      const feathers = new THREE.MeshStandardMaterial({ color: 0x73695f, roughness: 0.95,
        map: details.surfaceTexture('feathers') });
      const pale = new THREE.MeshStandardMaterial({ color: 0xa89e89, roughness: 1 });
      const breast = pale.clone();
      breast.map = details.surfaceTexture('feathers');
      const dark = new THREE.MeshStandardMaterial({ color: 0x313047, roughness: 0.85 });
      const gold = new THREE.MeshStandardMaterial({ color: 0xe5b96b, emissive: 0x80511d, emissiveIntensity: 0.15, roughness: 0.35 });
      const shape = (parent, geometry, material, position, scale) => {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(...position);
        if (scale) mesh.scale.set(...scale);
        mesh.castShadow = mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      };
      const sphere = new THREE.SphereGeometry(1, 16, 12);
      owlTorso = shape(owl, sphere, feathers, [0, 0.72, 0], [0.46, 0.65, 0.37]);
      shape(owl, sphere, breast, [0, 0.7, 0.25], [0.31, 0.46, 0.16]);
      for (const side of [-1, 1]) {
        const hinge = new THREE.Group();
        hinge.position.set(side * 0.33, 0.98, 0);
        owl.add(hinge);
        shape(hinge, sphere, feathers, [side * 0.04, -0.28, 0], [0.18, 0.48, 0.3]);
        hinge.rotation.z = side * 0.15;
        owlWings.push({ hinge, side });
        shape(owl, sphere, gold, [side * 0.2, 0.1, 0.12], [0.13, 0.07, 0.18]);
      }
      owlHead = new THREE.Group();
      owlHead.position.y = 1.3;
      owl.add(owlHead);
      shape(owlHead, sphere, feathers, [0, 0, 0], [0.45, 0.4, 0.36]);
      owlEyes = [];
      for (const side of [-1, 1]) {
        shape(owlHead, sphere, pale, [side * 0.18, 0, 0.28], [0.175, 0.23, 0.075]);
        const eye = new THREE.Group();
        eye.position.set(side * 0.18, 0.02, 0.36);
        owlHead.add(eye);
        shape(eye, sphere, gold, [0, 0, 0], [0.075, 0.085, 0.035]);
        shape(eye, sphere, dark, [0, 0, 0.028], [0.043, 0.065, 0.018]);
        owlEyes.push(eye);
        const ear = shape(owlHead, new THREE.ConeGeometry(0.1, 0.24, 5), feathers,
          [side * 0.3, 0.33, -0.03]);
        ear.rotation.z = -side * 0.22;
      }
      const beak = shape(owlHead, new THREE.ConeGeometry(0.085, 0.23, 4), gold, [0, -0.12, 0.43]);
      beak.rotation.x = Math.PI;
      islandGroup.add(owl);

      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 32;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#efb9d5';
      ctx.beginPath();
      ctx.ellipse(16, 16, 7, 12, 0.5, 0, Math.PI * 2);
      ctx.fill();
      const petalTexture = new THREE.CanvasTexture(canvas);
      petalTexture.colorSpace = THREE.SRGBColorSpace;
      const positions = new Float32Array(quality.petals * 3);
      for (let i = 0; i < quality.petals; i++) {
        const angle = Math.random() * Math.PI * 2, radius = Math.sqrt(Math.random()) * 12;
        const x = Math.cos(angle) * radius, z = Math.sin(angle) * radius;
        positions.set([x, 1 + Math.random() * 12, z], i * 3);
        petalData.push({ x, z, phase: Math.random() * Math.PI * 2, speed: 0.25 + Math.random() * 0.25 });
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 6, 0), 25);
      petals = new THREE.Points(geometry, new THREE.PointsMaterial({
        map: petalTexture, color: 0x9f88b6, size: 0.22, transparent: true,
        opacity: 0.65, depthWrite: false, alphaTest: 0.02
      }));
      scene.add(petals);
    }

    function pondPoint(angle, lane) {
      const outer = islandOutline(angle) - 0.7;
      const radius = THREE.MathUtils.lerp(14, outer, lane);
      return new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
    }

    function waterHeight(x, z, time) {
      const wind = x * 0.82 + z * 0.46;
      let height = 0.64 + Math.sin(wind * 1.45 - time * 1.2) * 0.034
        + Math.sin(x * -0.65 + z * 1.8 - time * 0.8) * 0.023
        + Math.cos(wind * 3.3 + time * 1.65) * 0.009;
      for (const ripple of waterRipples) {
        const age = time - ripple.start;
        if (age < 0 || age > 3.8) continue;
        const distance = Math.hypot(x - ripple.x, z - ripple.z);
        const front = (distance - age * 0.65) / 0.34;
        height += Math.cos(distance * 12 - age * 8) * Math.exp(-front * front)
          * 0.024 * (1 - age / 3.8);
      }
      return height;
    }

    function emitWaterRipple(x, z, time) {
      let target = waterRipples[0];
      for (const ripple of waterRipples) {
        if (ripple.start < target.start) target = ripple;
      }
      target.x = x;
      target.z = z;
      target.start = time;
      const radius = Math.hypot(x, z);
      target.radius = Math.max(0.2, Math.min(radius - 14,
        islandOutline(Math.atan2(z, x)) - 0.7 - radius) * 0.85);
    }

    function createPondLife() {
      const pearl = new THREE.MeshStandardMaterial({ color: 0xe4dfc9, roughness: 0.38 });
      const vermilion = new THREE.MeshStandardMaterial({ color: 0xd76329, roughness: 0.4 });
      const charcoal = new THREE.MeshStandardMaterial({ color: 0x2d3441, roughness: 0.45 });
      const fins = new THREE.MeshStandardMaterial({ color: 0xd4b27c, roughness: 0.4,
        transparent: true, opacity: 0.75, side: THREE.DoubleSide });
      const sphere = new THREE.SphereGeometry(1, 12, 8);
      const addEllipsoid = (parent, material, position, scale) => {
        const mesh = new THREE.Mesh(sphere, material);
        mesh.position.set(...position);
        mesh.scale.set(...scale);
        parent.add(mesh);
        return mesh;
      };
      const triangle = (points, material) => {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, material);
      };
      for (let i = 0; i < 2; i++) {
        const fish = new THREE.Group();
        const body = addEllipsoid(fish, pearl, [0, 0, 0], [0.22, 0.17, 0.63]);
        body.castShadow = false;
        // Soft vertical contact shadow on the submerged bed. The raised shore
        // depth-tests it away, so fish no longer cast moonlight shadows on land.
        const shadowGeometry = new THREE.PlaneGeometry(1, 1);
        shadowGeometry.rotateX(-Math.PI / 2);
        const shadow = new THREE.Mesh(shadowGeometry, new THREE.MeshBasicMaterial({
          map: createGlowTexture(), color: 0x07141c, transparent: true,
          opacity: 0.3, depthWrite: false, side: THREE.DoubleSide
        }));
        shadow.renderOrder = -1;
        scene.add(shadow);
        const markings = i === 0 ? vermilion : charcoal;
        addEllipsoid(fish, markings, [0.04, 0.12, 0.29], [0.16, 0.07, 0.2]);
        addEllipsoid(fish, markings, [-0.05, 0.12, -0.15], [0.14, 0.07, 0.17]);
        for (const side of [-1, 1]) {
          addEllipsoid(fish, charcoal, [side * 0.16, 0.06, 0.43], [0.035, 0.035, 0.035]);
          fish.add(triangle([side * 0.15, -0.04, 0.18, side * 0.5, -0.02, -0.12,
            side * 0.16, -0.04, -0.12], fins));
        }
        fish.add(triangle([0, 0.12, 0.17, 0, 0.33, -0.1, 0, 0.12, -0.35], fins));
        const tail = new THREE.Group();
        tail.position.z = -0.58;
        tail.add(triangle([0, 0, 0.05, -0.25, 0.05, -0.4, 0.25, -0.05, -0.4], fins));
        fish.add(tail);
        scene.add(fish);
        koi.push({ mesh: fish, tail, shadow, phase: i * 2.7 + 0.4, lane: 0.46 + i * 0.22,
          direction: i ? -1 : 1, jumping: false, lastWake: -i * 2 });
      }

      const padMaterial = new THREE.MeshStandardMaterial({ color: 0x4e7945,
        roughness: 0.55, side: THREE.DoubleSide });
      const padCount = compactDevice ? 16 : 20;
      for (let i = 0; i < padCount; i++) {
        const pad = new THREE.Group();
        const angle = 0.25 + i * Math.PI * 2 / padCount;
        const point = pondPoint(angle, i % 2 ? 0.19 : 0.81);
        const radius = 0.4 + (i % 3) * 0.1;
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.lineTo(Math.cos(0.17) * radius, Math.sin(0.17) * radius);
        shape.absarc(0, 0, radius, 0.17, Math.PI * 2 - 0.17, false);
        shape.lineTo(0, 0);
        const leaf = new THREE.Mesh(new THREE.ShapeGeometry(shape, 32), padMaterial);
        leaf.rotation.x = -Math.PI / 2;
        leaf.position.y = 0;
        leaf.rotation.z = i * 0.7;
        leaf.receiveShadow = true;
        pad.add(leaf);
        if (i % 2 === 0) {
          const flower = details.createLilyFlower(compactDevice);
          flower.position.y = 0.045;
          pad.add(flower);
        }
        pad.position.copy(point);
        scene.add(pad);
        lilyPads.push({ mesh: pad, x: point.x, z: point.z, phase: i * 1.8 });
      }

      const frogSkin = new THREE.MeshStandardMaterial({ color: 0x6b8249, roughness: 0.72 });
      const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0xbfa665, roughness: 0.4 });
      for (let i = 0; i < 2; i++) {
        const frog = new THREE.Group();
        const legs = [];
        const body = addEllipsoid(frog, frogSkin, [0, 0.12, 0], [0.19, 0.12, 0.25]);
        addEllipsoid(frog, frogSkin, [0, 0.18, 0.2], [0.18, 0.12, 0.15]);
        for (const side of [-1, 1]) {
          legs.push(addEllipsoid(frog, frogSkin, [side * 0.18, 0.08, -0.12], [0.13, 0.085, 0.17]));
          addEllipsoid(frog, frogSkin, [side * 0.16, 0.035, 0.23], [0.06, 0.025, 0.1]);
          addEllipsoid(frog, eyeMaterial, [side * 0.1, 0.28, 0.25], [0.055, 0.055, 0.05]);
          addEllipsoid(frog, charcoal, [side * 0.1, 0.28, 0.292], [0.027, 0.027, 0.018]);
        }
        frog.rotation.y = i * 2.3;
        frog.position.y = 0.025;
        lilyPads[i === 0 ? 1 : 5].mesh.add(frog);
        frogs.push({ body, rig: frog, legs, phase: i * 2.1, hopOffset: i * 11, hopping: false });
      }
      const ringGeometry = new THREE.RingGeometry(0.96, 1, 48);
      for (let i = 0; i < 8; i++) {
        const mesh = new THREE.Mesh(ringGeometry, new THREE.MeshBasicMaterial({
          color: 0xa0d4dc, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide
        }));
        mesh.rotation.x = -Math.PI / 2;
        mesh.visible = false;
        scene.add(mesh);
        waterRipples.push({ mesh, x: 0, z: 0, start: -Infinity, radius: 0.75 });
      }
      animatePondLife(0, 0);
    }

    function captureWaterReflections() {
      if (compactDevice) return;
      // One environment capture supplies subtle canopy/sky reflections without
      // six extra scene renders every frame. Light highlights remain dynamic.
      waterEnvironmentTarget = new THREE.WebGLCubeRenderTarget(128, { type: THREE.HalfFloatType });
      const capture = new THREE.CubeCamera(0.1, 500, waterEnvironmentTarget);
      capture.position.set(0, 2, 15);
      const hidden = [waterSurface, fireflies, petals, ...mistLayers.map(layer => layer.mesh)];
      const visibility = hidden.map(object => object.visible);
      hidden.forEach(object => { object.visible = false; });
      const shadowAutoUpdate = renderer.shadowMap.autoUpdate;
      renderer.shadowMap.autoUpdate = false;
      renderer.shadowMap.needsUpdate = true;
      try {
        capture.update(renderer, scene);
        waterSurface.material.envMap = waterEnvironmentTarget.texture;
        waterSurface.material.envMapIntensity = 0.45;
        waterSurface.material.needsUpdate = true;
      } finally {
        renderer.shadowMap.autoUpdate = shadowAutoUpdate;
        renderer.shadowMap.needsUpdate = true;
        hidden.forEach((object, i) => { object.visible = visibility[i]; });
      }
    }

    function animatePondLife(time, dt) {
      const motion = reducedMotion ? 0.25 : 1;
      for (let i = 0; i < koi.length; i++) {
        const fish = koi[i];
        const angle = fish.phase + time * 0.055 * fish.direction * motion;
        const point = pondPoint(angle, fish.lane);
        const ahead = pondPoint(angle + 0.01 * fish.direction, fish.lane);
        const cycle = (time + i * 13) % 38;
        const jumping = !reducedMotion && cycle > 24 && cycle < 25.6;
        const jumpPhase = jumping ? (cycle - 24) / 1.6 : 0;
        const lift = jumping ? Math.sin(jumpPhase * Math.PI) * 1.05 : 0;
        fish.mesh.position.set(point.x, waterHeight(point.x, point.z, time) - 0.34 + lift, point.z);
        fish.mesh.rotation.y = Math.atan2(ahead.x - point.x, ahead.z - point.z);
        fish.shadow.position.set(point.x, -0.25, point.z);
        fish.shadow.rotation.y = fish.mesh.rotation.y;
        fish.shadow.scale.set(0.58 + lift * 0.08, 1, 1.4 + lift * 0.1);
        fish.shadow.material.opacity = 0.3 / (1 + lift * 1.5);
        fish.mesh.rotation.x = jumping ? -Math.cos(jumpPhase * Math.PI) * 0.55 : Math.sin(time * 2 + i) * 0.025;
        fish.tail.rotation.y = Math.sin(time * 6 * motion + i) * 0.35;
        if (jumping !== fish.jumping) {
          window.dispatchEvent(new CustomEvent('pond-splash', {
            detail: { x: point.x, z: point.z, strength: jumping ? 0.4 : 1 }
          }));
        }
        if ((fish.jumping && !jumping) || (time - fish.lastWake > 4.5 && !jumping)) {
          emitWaterRipple(point.x, point.z, time);
          fish.lastWake = time;
        }
        fish.jumping = jumping;
      }
      for (const pad of lilyPads) {
        pad.mesh.position.y = waterHeight(pad.x, pad.z, time) + 0.025;
        pad.mesh.rotation.x = Math.sin(time * 0.65 + pad.phase) * 0.035 * motion;
        pad.mesh.rotation.z = Math.cos(time * 0.5 + pad.phase) * 0.025 * motion;
      }
      for (const frog of frogs) {
        frog.body.scale.y = 0.12 * (1 + Math.sin(time * 2 + frog.phase) * 0.035);
        const cycle = (time + frog.hopOffset) % 26;
        const hopping = !reducedMotion && cycle > 9 && cycle < 10.1;
        const hop = hopping ? Math.sin((cycle - 9) / 1.1 * Math.PI) : 0;
        frog.rig.position.y = 0.025 + hop * 0.35;
        frog.rig.rotation.x = hop * -0.18;
        for (const leg of frog.legs) leg.rotation.x = -hop * 0.5;
        if (frog.hopping && !hopping) {
          const point = frog.rig.getWorldPosition(new THREE.Vector3());
          window.dispatchEvent(new CustomEvent('pond-frog', { detail: { position: point.toArray() } }));
        }
        frog.hopping = hopping;
      }
      for (const ripple of waterRipples) {
        const age = time - ripple.start;
        ripple.mesh.visible = age >= 0 && age < 3.8;
        if (!ripple.mesh.visible) continue;
        ripple.mesh.position.set(ripple.x, waterHeight(ripple.x, ripple.z, time) + 0.018, ripple.z);
        ripple.mesh.scale.setScalar(Math.min(ripple.radius, 0.08 + age * 0.45));
        ripple.mesh.material.opacity = 0.23 * Math.pow(1 - age / 3.8, 2);
      }
    }

    function fishFigurePoint(index, count) {
      const t = index / count;
      if (t < 0.65) {
        const angle = t / 0.65 * Math.PI * 2;
        return new THREE.Vector3(Math.cos(angle) * 4.1, Math.sin(angle) * 1.25, 0);
      }
      const paths = [
        [[-3.8, 0], [-5.7, 1.8], [-5.1, 0], [-5.7, -1.8], [-3.8, 0]],
        [[-1.5, 1.17], [-1.8, 2.3], [1.2, 1.2]],
        [[-0.8, -1.2], [-1.5, -2.1], [1.1, -1.2]]
      ];
      const part = (t - 0.65) / 0.35 * 3;
      const pathIndex = Math.min(2, Math.floor(part));
      const path = paths[pathIndex];
      const position = (part - pathIndex) * (path.length - 1);
      const segment = Math.min(path.length - 2, Math.floor(position));
      const blend = position - segment;
      return new THREE.Vector3(THREE.MathUtils.lerp(path[segment][0], path[segment + 1][0], blend),
        THREE.MathUtils.lerp(path[segment][1], path[segment + 1][1], blend), 0);
    }

    function animateIslandLife(time, dt) {
      const motion = reducedMotion ? 0.25 : 1;
      for (const rock of driftingRocks) {
        const angle = rock.phase + time * rock.speed * motion;
        rock.mesh.position.x = Math.cos(angle) * rock.radius + Math.sin(time * 0.13 + rock.phase) * 0.4 * motion;
        rock.mesh.position.z = Math.sin(angle) * rock.radius;
        rock.mesh.position.y = rock.y + Math.sin(time * 0.38 + rock.phase) * rock.lift * motion;
        rock.mesh.rotation.y += dt * 0.025 * motion;
        rock.mesh.rotation.z = Math.sin(time * 0.16 + rock.phase) * 0.16 * motion;
      }
      if (owlHead) {
        const cycle = time % 28;
        const stretch = reducedMotion ? 0 : THREE.MathUtils.smoothstep(cycle, 9, 10.4)
          * (1 - THREE.MathUtils.smoothstep(cycle, 11.8, 13.5));
        for (const { hinge, side } of owlWings) hinge.rotation.z = side * (0.15 + stretch * 0.75);
        owlTorso.scale.y = 0.65 * (1 + Math.sin(time * 1.2) * 0.015);
        owlHead.rotation.y = Math.sin(time * 0.22) * 0.4 * motion;
        owlHead.rotation.x = 0;
        owlHead.rotation.z = Math.sin(time * 0.37) * 0.045 * motion;
        const blinkTime = time % 7;
        const openness = blinkTime < 0.22 ? Math.max(0.08, Math.abs(blinkTime - 0.11) / 0.11) : 1;
        for (const eye of owlEyes) eye.scale.y = openness;
      }
      if (petals) {
        const positions = petals.geometry.attributes.position.array;
        for (let i = 0; i < petalData.length; i++) {
          const data = petalData[i], index = i * 3;
          positions[index] += (0.25 + Math.sin(time * 0.8 + data.phase) * 0.16) * dt * motion;
          positions[index + 1] -= data.speed * dt * motion;
          positions[index + 2] += (0.08 + Math.cos(time * 0.63 + data.phase) * 0.12) * dt * motion;
          if (positions[index + 1] < 0.65 || Math.hypot(positions[index], positions[index + 2]) > 16) {
            positions[index] = data.x;
            positions[index + 1] = 7 + Math.random() * 6;
            positions[index + 2] = data.z;
          }
        }
        petals.geometry.attributes.position.needsUpdate = true;
      }
    }

    function createGroundMist() {
      // Soft overlapping horizontal wisps, rather than opaque fog walls.
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, 'rgba(170, 201, 235, 0.4)');
      gradient.addColorStop(0.45, 'rgba(170, 201, 235, 0.2)');
      gradient.addColorStop(1, 'rgba(170, 201, 235, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const geometry = new THREE.PlaneGeometry(1, 1);
      for (let i = 0; i < (compactDevice ? 10 : 16); i++) {
        const material = new THREE.MeshBasicMaterial({
          map: texture, color: 0x91b2d5, transparent: true, opacity: 0.25,
          depthWrite: false, side: THREE.DoubleSide
        });
        const mist = new THREE.Mesh(geometry, material);
        mist.rotation.x = -Math.PI / 2;
        mist.rotation.z = Math.random() * Math.PI;
        mist.scale.set(9 + Math.random() * 7, 3 + Math.random() * 4, 1);
        const angle = i * 2.39996;
        const radius = 3 + Math.sqrt(i / 16) * 9;
        const x = Math.cos(angle) * radius, z = Math.sin(angle) * radius;
        const y = 0.8 + Math.random() * 1.2;
        mist.position.set(x, y, z);
        mistLayers.push({ mesh: mist, x, y, z, phase: angle });
        scene.add(mist);
      }
      for (let i = 0; i < (compactDevice ? 5 : 8); i++) {
        const angle = i * 2.39996;
        const mist = new THREE.Sprite(new THREE.SpriteMaterial({
          map: texture, color: 0x86a6c5, transparent: true, opacity: 0.12, depthWrite: false
        }));
        mist.scale.set(8 + i % 3, 3.5, 1);
        mistLayers.push({ mesh: mist, spill: true, angle,
          radius: islandOutline(angle) + 0.4, phase: i / 8 });
        scene.add(mist);
      }
    }

    /**
     * Bioluminescent Mushrooms & Fireflies (Constrained to Floating Island Volume)
     */
    function setupMushroomsAndFireflies() {
      // 1. Bioluminescent Cyan Mushrooms clustered near the main sakura roots
      const mushroomGroup = new THREE.Group();
      const mushroomMat = new THREE.MeshStandardMaterial({
        color: 0x00ffcc,
        emissive: 0x00ffcc,
        emissiveIntensity: 2.5,
        roughness: 0.4
      });
      const mushroomStemMat = new THREE.MeshStandardMaterial({
        color: 0x2a3b40,
        roughness: 0.8
      });

      for (let i = 0; i < 15; i++) {
        const mush = new THREE.Group();
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.07, 0.28, 6), mushroomStemMat);
        stem.position.y = 0.14;

        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.14, 6, 4, 0, Math.PI * 2, 0, Math.PI / 2), mushroomMat);
        cap.position.y = 0.28;

        mush.add(stem);
        mush.add(cap);

        const angle = Math.random() * Math.PI * 2;
        const radius = 1.5 + Math.random() * 3.5;
        mush.position.set(Math.cos(angle) * radius, 0.5, Math.sin(angle) * radius);
        mush.rotation.y = Math.random() * Math.PI;
        mushroomGroup.add(mush);
      }
      islandGroup.add(mushroomGroup);

      // 2. Firefly Particle System (300 particles floating over the island plateau)
      fireflyCount = quality.fireflies;
      fireflyGeo = new THREE.BufferGeometry();
      const fireflyPositions = new Float32Array(fireflyCount * 3);
      const fireflyColors = new Float32Array(fireflyCount * 3);
      fireflyData = [];
      treeAvoidance.update();

      for (let i = 0; i < fireflyCount; i++) {
        // Confined across island radius (up to 15.5 units)
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 15.5;
        let x = Math.cos(angle) * radius;
        let z = Math.sin(angle) * radius;
        let y = 0.8 + Math.random() * 7.5;
        for (let attempt = 0; attempt < 30 && !treeAvoidance.isFree(x, y, z); attempt++) {
          const angle = Math.random() * Math.PI * 2, radius = Math.sqrt(Math.random()) * 15.5;
          x = Math.cos(angle) * radius; z = Math.sin(angle) * radius;
          y = 0.8 + Math.random() * 7.5;
        }
        while (!treeAvoidance.isFree(x, y, z)) y += 0.5;

        fireflyPositions[i * 3] = x;
        fireflyPositions[i * 3 + 1] = y;
        fireflyPositions[i * 3 + 2] = z;

        // Vivid glowing spectrum (golden-amber, soft rose, fairy cyan)
        const hue = (Math.random() < 0.4)
          ? 0.92 + Math.random() * 0.08  // Rose / pink
          : 0.12 + Math.random() * 0.25; // Warm gold to cyan
        const color = new THREE.Color().setHSL(hue, 1.0, 0.65);
        if (-x * 0.85 - z * 0.52 > 5 && y < 5) color.setHSL(0.105, 0.72, 0.65);

        fireflyColors[i * 3] = color.r;
        fireflyColors[i * 3 + 1] = color.g;
        fireflyColors[i * 3 + 2] = color.b;

        fireflyData.push({
          home: new THREE.Vector3(x, y, z),
          figure: i < swarmCount ? fishFigurePoint(i, swarmCount) : null,
          velocity: new THREE.Vector3(),
          color: color.clone(),
          speed: 0.5 + Math.random(),
          phaseX: Math.random() * Math.PI * 2,
          phaseY: Math.random() * Math.PI * 2,
          phaseZ: Math.random() * Math.PI * 2
        });
      }

      fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPositions, 3));
      fireflyGeo.setAttribute('color', new THREE.BufferAttribute(fireflyColors, 3));

      fireflyMat = new THREE.PointsMaterial({
        size: 0.55,
        map: createGlowTexture(),
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      fireflies = new THREE.Points(fireflyGeo, fireflyMat);
      // Initial bounds do not cover every possible drift position.
      fireflyGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 5, 0), 23);
      scene.add(fireflies);
    }

    /**
     * Viewport Resize Event Handler
     */
    function snapshotCamera() {
      return { position: camera.position.clone(), target: controls.target.clone(),
        spherical: new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target)) };
    }

    function updateCinematicCamera(time, dt, now) {
      if (reducedMotion || cameraHeld) return;
      if (now < cameraResumeAt) {
        if (inspectionAnchor) {
          const elapsed = (now - inspectionAnchor.started) / 1000;
          if (elapsed < 0.3) {
            inspectionAnchor = { ...snapshotCamera(), started: inspectionAnchor.started };
          } else {
            const amplitude = Math.min(0.32, inspectionAnchor.spherical.radius * 0.015);
            const drift = new THREE.Vector3(Math.sin(elapsed * 0.65) * amplitude,
              Math.sin(elapsed * 0.47) * amplitude * 0.65, Math.sin(elapsed * 0.3) * amplitude * 0.25)
              .applyQuaternion(camera.quaternion);
            camera.position.copy(inspectionAnchor.position).add(drift);
            controls.target.copy(inspectionAnchor.target);
          }
        }
        return;
      }
      const polar = THREE.MathUtils.clamp(overviewPolar + Math.sin(time * 0.08) * 0.035,
        0.08, (controls.maxPolarAngle || 1.43) - 0.01);
      orbitOffset.copy(camera.position).sub(controls.target);
      orbitSpherical.setFromVector3(orbitOffset);
      if (returnToOverview) {
        if (!cameraReturn) {
          cameraReturn = { start: now, spherical: orbitSpherical.clone(), target: controls.target.clone() };
          cameraReturn.destination = zoomReturnPose || { target: overviewTarget.clone(),
            spherical: new THREE.Spherical(overviewRadius, polar, overviewTheta) };
          cameraReturn.turn = Math.atan2(Math.sin(cameraReturn.destination.spherical.theta - orbitSpherical.theta),
            Math.cos(cameraReturn.destination.spherical.theta - orbitSpherical.theta));
        }
        const progress = THREE.MathUtils.clamp((now - cameraReturn.start) / 3500, 0, 1);
        const ease = THREE.MathUtils.smootherstep(progress, 0, 1);
        controls.target.copy(cameraReturn.target).lerp(cameraReturn.destination.target, ease);
        orbitSpherical.radius = THREE.MathUtils.lerp(cameraReturn.spherical.radius, cameraReturn.destination.spherical.radius, ease);
        orbitSpherical.phi = THREE.MathUtils.lerp(cameraReturn.spherical.phi, cameraReturn.destination.spherical.phi, ease);
        orbitSpherical.theta = cameraReturn.spherical.theta + cameraReturn.turn * ease;
        if (progress === 1) {
          overviewTarget.copy(cameraReturn.destination.target);
          overviewRadius = cameraReturn.destination.spherical.radius;
          overviewTheta = cameraReturn.destination.spherical.theta;
          overviewPolar = cameraReturn.destination.spherical.phi - Math.sin(time * 0.08) * 0.035;
          returnToOverview = false; cameraReturn = null; zoomReturnPose = null; inspectionAnchor = null;
        }
      } else {
        inspectionAnchor = null;
        overviewTheta += dt * 0.066 * (1 - Math.cos(overviewTheta - Math.PI / 4) * 0.12);
        controls.target.copy(overviewTarget);
        orbitSpherical.set(overviewRadius, polar, overviewTheta);
      }
      orbitOffset.setFromSpherical(orbitSpherical);
      camera.position.copy(controls.target).add(orbitOffset);
    }

    function resizeMobileBloom() {
      if (compactDevice && bloomPass) {
        const ratio = renderer.getPixelRatio() * 0.75;
        bloomPass.setSize(window.innerWidth * ratio, window.innerHeight * ratio);
      }
    }

    function updateMobileRendering(time, dt) {
      if (!compactDevice) return;
      const distance = camera.position.distanceTo(controls.target);
      if (scene.fog) scene.fog.density = THREE.MathUtils.damp(scene.fog.density,
        0.009 * Math.min(1, 56 / distance), 4, dt);
      if (renderer.shadowMap && time >= nextShadowFrame) {
        renderer.shadowMap.needsUpdate = true;
        nextShadowFrame = time + (distance < 35 ? 1 / 18 : 1 / 10);
      }
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.fov = camera.aspect < 1 ? 50 : 45;
      overviewRadius = Math.max(56, 29 / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect));
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, quality.pixelRatio));

      if (composer) {
        composer.setPixelRatio(renderer.getPixelRatio());
        composer.setSize(width, height);
        resizeMobileBloom();
      }
    }

    /**
     * Main Animation Loop
     */
    function animate() {
      requestAnimationFrame(animate);

      // Smooth camera orbit
      const frameDelta = clock.getDelta();
      const dt = Math.min(frameDelta, 0.04);
      const time = clock.elapsedTime;
      updateCinematicCamera(time, dt, performance.now());
      controls.update(dt);
      if (cosmicSky) cosmicSky.update(time, camera);
      if (accretionDisk) accretionDisk.update(reducedMotion ? 0 : time, camera,
        window.innerHeight * renderer.getPixelRatio());
      if (time >= nextAudioFrame) {
        nextAudioFrame = time + 0.05;
        camera.getWorldDirection(audioForward);
        audioUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
        window.dispatchEvent(new CustomEvent('forest-listener', { detail: {
          position: camera.position.toArray(), forward: audioForward.toArray(), up: audioUp.toArray()
        } }));
      }
      if (moon) {
        moon.update(time);
        if (moonLight) {
          moonLight.position.set(moon.mesh.position.x * 0.11,
            24 + Math.sin(time * 0.008) * 3, moon.mesh.position.z * 0.11);
          moonLight.intensity = 1.7 + moon.illumination * 0.5;
        }
      }
      // One conservative downgrade for sustained slow frames, excluding hidden tabs.
      if (!qualityAdjusted && time > 4 && !document.hidden && frameDelta < 0.15
          && !cameraHeld && performance.now() >= cameraResumeAt) {
        frameSum += frameDelta;
        if (++frameSamples >= 180) {
          if (frameSum / frameSamples > 0.034) {
            quality.pixelRatio = Math.max(0.85, quality.pixelRatio * 0.75);
            onWindowResize();
          }
          qualityAdjusted = true;
        }
      } else if (cameraHeld || performance.now() < cameraResumeAt) {
        frameSum = 0; frameSamples = 0;
      }
      animateIslandLife(time, dt);
      animatePondLife(time, dt);
      let cursorHit = false;
      if (pointerActive) {
        raycaster.setFromCamera(pointer, camera);
        cursorHit = raycaster.ray.intersectPlane(hoverPlane, cursorWorld) !== null;
        cursorHit = cursorHit && cursorWorld.lengthSq() < 24 * 24;
      }
      for (const layer of mistLayers) {
        if (layer.spill) {
          const travel = (time * 0.025 + layer.phase) % 1;
          const radius = layer.radius + travel * 3;
          layer.mesh.position.set(Math.cos(layer.angle) * radius + Math.sin(time * 0.12) * 0.4,
            -0.6 - travel * 3.5, Math.sin(layer.angle) * radius);
          layer.mesh.material.opacity = Math.sin(travel * Math.PI) * 0.26;
          continue;
        }
        layer.mesh.position.set(layer.x + Math.sin(time * 0.09 + layer.phase) * 1.5,
          layer.y + Math.sin(time * 0.15 + layer.phase) * 0.15,
          layer.z + Math.cos(time * 0.07 + layer.phase) * 0.8);
        layer.mesh.material.opacity = 0.27 + Math.sin(time * 0.2 + layer.phase) * 0.05;
      }
      for (const { mesh, rest, phase, amplitude } of crowns) {
        const motion = reducedMotion ? 0.25 : 1;
        mesh.position.x = rest.x + Math.sin(time * 0.8 + phase) * amplitude * motion;
        mesh.position.z = rest.z + Math.sin(time * 0.63 + phase) * amplitude * 0.6 * motion;
        mesh.rotation.z = Math.sin(time * 0.8 + phase) * 0.012 * motion;
      }
      treeAvoidance.update();
      if (waterSurface && ++waterFrame % (compactDevice ? 3 : 2) === 0) {
        waterSurface.material.normalMap.offset.set(time * 0.006, time * 0.003);
        waterSurface.material.clearcoatNormalMap.offset.set(-time * 0.009, time * 0.006);
        const gust = 0.21 + Math.sin(time * 0.19) * 0.04;
        waterSurface.material.normalScale.set(gust, gust);
        const position = waterSurface.geometry.attributes.position;
        for (let i = 0; i < position.count; i++) {
          const x = waterRestPositions[i * 3], z = waterRestPositions[i * 3 + 2];
          position.setY(i, waterHeight(x, z, time) - 0.64);
        }
        position.needsUpdate = true;
        waterSurface.geometry.computeVertexNormals();
      }

      // Harmonic kinematic firefly drift (kept over the floating island)
      if (fireflies && fireflyData && fireflyData.length) {
        const positions = fireflies.geometry.attributes.position.array;
        const colors = fireflies.geometry.attributes.color.array;
        // One shared swarm: koi introduction, then twelve zodiac glyphs.
        // Descent finishes at 126; the next ascent begins at 137 + 4: 15 seconds of rest.
        const cycle = time % 137;
        const formation = reducedMotion ? 0 : THREE.MathUtils.smoothstep(cycle, 4, 12)
          * (1 - THREE.MathUtils.smoothstep(cycle, 118, 126));
        const patternIndex = cycle < 22 ? 0 : Math.min(12, 1 + Math.floor((cycle - 22) / 8));
        const pattern = swarmPatterns[patternIndex];
        const previous = swarmPatterns[Math.max(0, patternIndex - 1)];
        const morph = patternIndex ? THREE.MathUtils.smoothstep((cycle - 22) % 8, 0, 2.5) : 1;
        if (ceremonyLight) {
          // A quiet, continuous lift on the upper crowns; no flashes at glyph changes.
          const pulse = 0.84 + Math.sin(Math.max(0, cycle - 22) * Math.PI / 4) * 0.16;
          ceremonyLight.intensity = THREE.MathUtils.damp(ceremonyLight.intensity,
            formation * pulse * 0.24, 1.2, dt);
        }
        if (skyLabel) {
          const screen = swarmCenter.clone().project(camera);
          // Hold a pixel-aligned caption throughout each glyph. Reposition while faded
          // at transitions, or during a drag when the caption is hidden.
          const key = `${patternIndex}:${innerWidth}:${innerHeight}`;
          if (cameraHeld) captionKey = '';
          if (captionKey !== key) {
            const caption = new THREE.Vector3(0, -3.6, 0).applyQuaternion(camera.quaternion)
              .add(swarmCenter).project(camera);
            skyLabel.style.left = `${Math.round(THREE.MathUtils.clamp((caption.x + 1) * innerWidth / 2, 70, innerWidth - 70))}px`;
            skyLabel.style.top = `${Math.round(THREE.MathUtils.clamp((1 - caption.y) * innerHeight / 2, 18, innerHeight * 0.48))}px`;
            if (!cameraHeld) captionKey = key;
          }
          const name = patternIndex ? pattern.name : '';
          if (skyLabel.textContent !== name) skyLabel.textContent = name;
          const signAge = (cycle - 22) % 8;
          const reveal = reducedMotion ? Number(signAge >= 2.5)
            : THREE.MathUtils.smootherstep(signAge, 1.8, 2.5);
          skyLabel.style.filter = reducedMotion ? 'none' : `blur(${((1 - reveal) * 6).toFixed(2)}px)`;
          skyLabel.style.transform = `translateX(-50%) translateY(${reducedMotion ? 0 : ((1 - reveal) * 3).toFixed(2)}px)`;
          skyLabel.style.opacity = patternIndex && cycle < 118 && !cameraHeld && screen.z < 1 && screen.z > -1
            && Math.abs(screen.x) < 1 && Math.abs(screen.y) < 1
            ? String(formation * reveal * (1 - THREE.MathUtils.smoothstep(signAge, 7.1, 8)) * 0.8) : '0';
        }

        for (let i = 0; i < fireflyCount; i++) {
          const data = fireflyData[i];
          const i3 = i * 3;

          const x = positions[i3], y = positions[i3 + 1], z = positions[i3 + 2];
          const velocity = data.velocity;
          const gathering = data.figure ? formation : 0;
          swarmTarget.copy(data.home);
          if (gathering > 0) {
            swarmTarget.set(THREE.MathUtils.lerp(previous.points[i * 2], pattern.points[i * 2], morph),
              THREE.MathUtils.lerp(previous.points[i * 2 + 1], pattern.points[i * 2 + 1], morph), 0)
              .applyQuaternion(camera.quaternion).add(swarmCenter);
            swarmTarget.lerp(data.home, 1 - gathering);
          }
          const spring = THREE.MathUtils.lerp(0.22, 3.2, gathering);
          const wander = 1 - gathering * 0.95;
          velocity.x += ((swarmTarget.x - x) * spring
            + Math.sin(time * data.speed * 0.6 + data.phaseX) * 0.85 * wander) * dt;
          velocity.y += ((swarmTarget.y - y) * (spring + 0.13)
            + Math.cos(time * data.speed * 0.7 + data.phaseY) * 0.6 * wander) * dt;
          velocity.z += ((swarmTarget.z - z) * spring
            + Math.sin(time * data.speed * 0.5 + data.phaseZ) * 0.85 * wander) * dt;
          treeAvoidance.steer(x, y, z, velocity, dt, gathering > 0);
          if (cursorHit) {
            const dx = x - cursorWorld.x, dy = y - cursorWorld.y, dz = z - cursorWorld.z;
            const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (distance < 4.5) {
              const force = 7 * Math.pow(1 - distance / 4.5, 2) * dt * (1 - gathering) / Math.max(distance, 0.15);
              velocity.x += dx * force;
              velocity.y += dy * force;
              velocity.z += dz * force;
            }
          }
          velocity.multiplyScalar(Math.exp(-THREE.MathUtils.lerp(0.9, 2.6, gathering) * dt))
            .clampLength(0, THREE.MathUtils.lerp(2.5, 5, gathering));
          positions[i3] += velocity.x * dt;
          positions[i3 + 1] = Math.max(0.7, y + velocity.y * dt);
          positions[i3 + 2] += velocity.z * dt;
          treeAvoidance.resolve(positions, i3, velocity);
          const pulse = 1.5 + Math.pow(0.5 + 0.5 * Math.sin(time * data.speed * 1.8 + data.phaseY), 3) * 3;
          colors[i3] = THREE.MathUtils.lerp(data.color.r, swarmColor.r, gathering) * pulse;
          colors[i3 + 1] = THREE.MathUtils.lerp(data.color.g, swarmColor.g, gathering) * pulse;
          colors[i3 + 2] = THREE.MathUtils.lerp(data.color.b, swarmColor.b, gathering) * pulse;
        }

        fireflies.geometry.attributes.position.needsUpdate = true;
        fireflies.geometry.attributes.color.needsUpdate = true;
      }

      updateMobileRendering(time, dt);

      // Render through Bloom Post-processing
      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    // Launch scene on DOM load
    window.addEventListener('DOMContentLoaded', init);
  </script>
