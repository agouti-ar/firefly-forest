<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Floating Island | Three.js Diorama</title>
  <style>
    /* Full-viewport reset and clean canvas presentation */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060d20;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      outline: none;
    }
  </style>

  <!-- Three.js & OrbitControls via CDN Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Clean, full-screen WebGL viewport without UI overlay -->
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    /**
     * Application Singletons & State
     */
    let scene, camera, renderer, controls, composer;
    let islandGroup;
    let fireflyCount, fireflyGeo, fireflyData, fireflies, fireflyMat;
    const clock = new THREE.Clock();
    const mistLayers = [], crowns = [];
    let waterSurface, waterRestPositions;
    const pointer = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();
    const hoverPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -3);
    const cursorWorld = new THREE.Vector3();
    let pointerActive = false;

    /**
     * Entry Point: Initialize WebGL environment, lighting, geometry, and controls
     */
    function init() {
      const canvas = document.getElementById('webgl-canvas');

      // 1. Scene & Sunset Gradient Atmosphere (Patch 4)
      scene = new THREE.Scene();
      setupNightSky();
      scene.fog = new THREE.FogExp2(0x101e36, 0.009);

      // 2. Camera Setup (Patch 4: Isometric angle overlooking the diorama)
      const aspect = window.innerWidth / window.innerHeight;
      camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 180);
      camera.position.set(36, 26, 36);

      // 3. Renderer with ACES Filmic Tone Mapping & Soft Shadows
      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05; // Balanced exposure to prevent white clipping
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      // 4. OrbitControls Setup (Patch 4: Centered isometric rotation)
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1, 0);
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5; // Slow, majestic diorama rotation
      controls.maxPolarAngle = Math.PI / 2.2; // Keep camera above horizon
      controls.minDistance = 10;
      controls.maxDistance = 75;
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // 5. Build Diorama Entities
      setupLighting();
      createFloatingIsland();
      createIslandDetails();
      setupMushroomsAndFireflies();
      createGroundMist();

      // 6. Post-processing Pipeline: UnrealBloomPass & OutputPass (Calibrated for crisp diorama)
      const renderScene = new RenderPass(scene, camera);
      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.7,
        0.5,
        1.0 // HDR fireflies and mushrooms bloom; ordinary surfaces stay crisp
      );
      const outputPass = new OutputPass();

      composer = new EffectComposer(renderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);
      composer.addPass(outputPass);

      // 7. Responsive Resize Handling
      window.addEventListener('resize', onWindowResize, false);
      canvas.addEventListener('pointermove', (event) => {
        if (event.pointerType === 'touch') return;
        const rect = canvas.getBoundingClientRect();
        pointer.set((event.clientX - rect.left) / rect.width * 2 - 1,
          -(event.clientY - rect.top) / rect.height * 2 + 1);
        pointerActive = true;
      });
      canvas.addEventListener('pointerleave', () => { pointerActive = false; });
      window.addEventListener('blur', () => { pointerActive = false; });

      // 8. Start Render Loop
      animate();
    }

    /**
     * Procedural Sky Gradient:
     * Twilight violet top transitioning through rose-magenta to warm golden sunset.
     */
    function setupNightSky() {
      const canvas = document.createElement('canvas');
      canvas.width = 2;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, '#030817');
      gradient.addColorStop(0.55, '#0b1730');
      gradient.addColorStop(1, '#1b3049');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 2, 512);

      const bgTexture = new THREE.CanvasTexture(canvas);
      bgTexture.colorSpace = THREE.SRGBColorSpace;
      scene.background = bgTexture;
      const positions = [], colors = [];
      for (let i = 0; i < 1400; i++) {
        const azimuth = Math.random() * Math.PI * 2;
        const elevation = Math.random();
        const ring = Math.sqrt(1 - elevation * elevation);
        positions.push(110 * ring * Math.cos(azimuth), 110 * elevation,
          110 * ring * Math.sin(azimuth));
        const brightness = 0.25 + Math.random() * 0.55;
        colors.push(brightness * 0.8, brightness * 0.9, brightness);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      scene.add(new THREE.Points(geometry, new THREE.PointsMaterial({
        size: 0.19, vertexColors: true, transparent: true, opacity: 0.85,
        fog: false, depthWrite: false
      })));
    }

    /**
     * Lighting Setup (Patch 4: Warm sunset palette):
     * - Warm ambient illumination
     * - Angled sunset DirectionalLight casting soft shadows
     * - Bioluminescent turquoise point light beneath the island from the water ring
     */
    function setupLighting() {
      // 1. Warm Ambient Light
      const ambientLight = new THREE.HemisphereLight(0x8baee8, 0x283449, 0.85);
      scene.add(ambientLight);

      // 2. Sunset Directional Light
      const sunsetLight = new THREE.DirectionalLight(0xb8d7ff, 2.2);
      sunsetLight.position.set(-18, 24, -16);
      sunsetLight.castShadow = true;
      sunsetLight.shadow.mapSize.width = 2048;
      sunsetLight.shadow.mapSize.height = 2048;
      sunsetLight.shadow.camera.near = 0.5;
      sunsetLight.shadow.camera.far = 80;
      sunsetLight.shadow.camera.left = -25;
      sunsetLight.shadow.camera.right = 25;
      sunsetLight.shadow.camera.top = 25;
      sunsetLight.shadow.camera.bottom = -25;
      sunsetLight.shadow.bias = -0.0004;
      sunsetLight.shadow.radius = 2.0;
      scene.add(sunsetLight);
      const fillLight = new THREE.DirectionalLight(0x768bc4, 0.45);
      fillLight.position.set(15, 10, 20);
      scene.add(fillLight);

      // 3. Subtle turquoise water glow reflecting from underneath
      const waterLight = new THREE.PointLight(0x00d8f0, 1.2, 16);
      waterLight.position.set(0, -2, 0);
      scene.add(waterLight);

      // 4. Warm subtle glow near central tree roots
      const rootGlow = new THREE.PointLight(0xffaa55, 1.2, 8);
      rootGlow.position.set(0, 1.2, 0);
      scene.add(rootGlow);
    }

    /**
     * Patch 4: Floating Island Construction
     * Inverted rocky cone base, mossy green plateau top, glowing water ring, and sakura grove.
     */
    function createFloatingIsland() {
      islandGroup = new THREE.Group();

      // Shared irregular outline keeps the soil and exposed rock joined.
      const segments = 40;
      const outline = (angle) => 17.6 + Math.sin(angle * 3 + 0.4) * 0.65
        + Math.sin(angle * 7) * 0.38 + Math.cos(angle * 11) * 0.22;
      const vertices = [], indices = [];
      const rings = [[1, -0.4], [0.97, -2.1], [0.73, -5.3], [0.39, -8.2], [0.08, -10.2]];
      rings.forEach(([scale, height], ring) => {
        for (let i = 0; i < segments; i++) {
          const angle = i / segments * Math.PI * 2;
          const radius = outline(angle) * scale * (1 + (ring ? Math.sin(i * 5.7 + ring) * 0.09 : 0));
          vertices.push(Math.cos(angle) * radius + ring * 0.38,
            height + (ring ? Math.sin(i * 2.3 + ring * 1.7) * 0.65 : 0),
            Math.sin(angle) * radius - ring * 0.22);
          if (ring < rings.length - 1) {
            const a = ring * segments + i, b = ring * segments + (i + 1) % segments;
            indices.push(a, b, a + segments, b, b + segments, a + segments);
          }
        }
      });
      vertices.push(1.6, -11.4, -0.9);
      const tip = vertices.length / 3 - 1;
      for (let i = 0; i < segments; i++) {
        const start = (rings.length - 1) * segments;
        indices.push(start + i, start + (i + 1) % segments, tip);
      }
      const rockGeo = new THREE.BufferGeometry();
      rockGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      rockGeo.setIndex(indices);
      rockGeo.computeVertexNormals();
      const rockMat = new THREE.MeshStandardMaterial({
        color: 0x414658,
        roughness: 0.9,
        flatShading: true
      });
      const rockBase = new THREE.Mesh(rockGeo, rockMat);
      rockBase.receiveShadow = true;
      rockBase.castShadow = true;
      islandGroup.add(rockBase);
      // Small embedded shards break up the lower silhouette.
      for (let i = 0; i < 9; i++) {
        const angle = i * 2.39996;
        const length = 1.4 + Math.random() * 2.4;
        const shard = new THREE.Mesh(new THREE.ConeGeometry(1.1 + Math.random(), length, 5), rockMat);
        shard.rotation.set(Math.PI + Math.sin(angle) * 0.18, angle, Math.cos(angle) * 0.2);
        shard.position.set(Math.cos(angle) * 8, -5.1 - length * 0.25, Math.sin(angle) * 8);
        shard.castShadow = shard.receiveShadow = true;
        islandGroup.add(shard);
      }

      // 2. Lush Grass Plateau (Top of the island)
      const grassGeo = new THREE.CylinderGeometry(1, 1, 0.9, segments, 1);
      const soilPositions = grassGeo.attributes.position;
      const soilColors = [];
      const moss = new THREE.Color(0x386b54), earth = new THREE.Color(0x454038);
      for (let i = 0; i < soilPositions.count; i++) {
        const x = soilPositions.getX(i), z = soilPositions.getZ(i);
        const angle = Math.atan2(z, x);
        const radius = outline(angle);
        soilPositions.setXYZ(i, x * radius, soilPositions.getY(i), z * radius);
        const tint = (soilPositions.getY(i) > 0 ? moss : earth).clone();
        tint.multiplyScalar(0.85 + 0.15 * Math.sin(angle * 9));
        soilColors.push(tint.r, tint.g, tint.b);
      }
      grassGeo.setAttribute('color', new THREE.Float32BufferAttribute(soilColors, 3));
      grassGeo.computeVertexNormals();
      const grassMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.8,
        flatShading: true
      });
      const grassTop = new THREE.Mesh(grassGeo, grassMat);
      grassTop.position.y = 0;
      grassTop.receiveShadow = true;
      islandGroup.add(grassTop);
      // Uneven moss cushions along the shore, clear of the water channel.
      const mossMat = new THREE.MeshStandardMaterial({ color: 0x315d48, roughness: 1, flatShading: true });
      for (let i = 0; i < 24; i++) {
        const angle = i * 2.39996;
        const patch = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), mossMat);
        const radius = i % 2 ? 13.3 : outline(angle) - 0.4;
        patch.position.set(Math.cos(angle) * radius, 0.5, Math.sin(angle) * radius);
        patch.scale.set(0.7 + Math.random() * 0.5, 0.15 + Math.random() * 0.2, 0.6 + Math.random() * 0.5);
        patch.receiveShadow = true;
        islandGroup.add(patch);
      }

      // 3. Luminous Turquoise Water Ring (Balanced soft glow)
      const waterGeo = new THREE.RingGeometry(14, 16.7, 96, 8);
      waterGeo.rotateX(-Math.PI / 2);
      const waterPositions = waterGeo.attributes.position;
      for (let i = 0; i < waterPositions.count; i++) {
        const x = waterPositions.getX(i), z = waterPositions.getZ(i);
        const radius = Math.hypot(x, z);
        const angle = Math.atan2(z, x);
        const shoreRadius = 14 + (radius - 14) / 2.7 * (outline(angle) - 0.7 - 14);
        waterPositions.setXYZ(i, x * shoreRadius / radius, 0, z * shoreRadius / radius);
      }
      waterGeo.computeVertexNormals();
      const waterMat = new THREE.MeshPhysicalMaterial({
        color: 0x39858e,
        roughness: 0.19,
        metalness: 0,
        clearcoat: 1,
        clearcoatRoughness: 0.12,
        ior: 1.333,
        transparent: true,
        opacity: 0.48,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const waterRing = new THREE.Mesh(waterGeo, waterMat);
      waterRing.position.y = 0.64;
      waterRing.receiveShadow = true;
      waterSurface = waterRing;
      waterRestPositions = waterGeo.attributes.position.array.slice();
      islandGroup.add(waterRing);

      // 4. Centerpiece Blooming Sakura Tree (Scale: 1.8)
      const mainSakura = createSakuraTree(1.8);
      mainSakura.position.set(0, 0.5, 0);
      islandGroup.add(mainSakura);

      // Loose asymmetric grove with a foreground clearing and guaranteed spacing.
      const grove = [[-9, -6], [-2, -11], [6, -9], [11, -2],
        [-11, 2], [-6, 9], [5, 10]];
      for (let i = 0; i < grove.length; i++) {
        const treeScale = 0.68 + Math.random() * 0.27;
        const tree = createSakuraTree(treeScale);
        tree.position.set(grove[i][0], 0.5, grove[i][1]);
        tree.rotation.y = Math.random() * Math.PI * 2;
        islandGroup.add(tree);
      }

      scene.add(islandGroup);
    }

    /**
     * Patch 4: Sakura Tree Generator
     * Stylized organic trunk with curved inclination and blossoming pink canopies.
     */
    function createSakuraTree(scale = 1) {
      const treeGroup = new THREE.Group();

      // Slender curved trunk
      const trunkHeight = 6 * scale;
      const trunkGeo = new THREE.CylinderGeometry(0.3 * scale, 0.8 * scale, trunkHeight, 6);
      const trunkMat = new THREE.MeshStandardMaterial({
        color: 0x4a2c2a,
        roughness: 0.8,
        flatShading: true
      });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = trunkHeight / 2;
      trunk.rotation.z = (Math.random() - 0.5) * 0.22;
      trunk.rotation.x = (Math.random() - 0.5) * 0.15;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      treeGroup.add(trunk);

      // Blooming pink cherry blossom foliage clusters
      const leafMat = new THREE.MeshStandardMaterial({
        color: 0xffb7c5,          // Delicate cherry blossom pink
        roughness: 0.6,
        flatShading: true,
        emissive: 0x331122,       // Subtle warm internal glow for bloom catching
        emissiveIntensity: 0.04
      });

      const numLeafClusters = 6 + Math.floor(Math.random() * 4);
      for (let i = 0; i < numLeafClusters; i++) {
        const leafGeo = new THREE.IcosahedronGeometry((1.2 + Math.random() * 1.2) * scale, 1);
        const leaves = new THREE.Mesh(leafGeo, leafMat);

        const angle = (i / numLeafClusters) * Math.PI * 2 + Math.random();
        const dist = Math.random() * 2 * scale;

        leaves.position.set(
          Math.cos(angle) * dist,
          trunkHeight - (Math.random() * 2.5 * scale),
          Math.sin(angle) * dist
        );
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        treeGroup.add(leaves);
        crowns.push({ mesh: leaves, rest: leaves.position.clone(),
          phase: Math.random() * Math.PI * 2, amplitude: 0.06 * scale });
      }

      return treeGroup;
    }

    /**
     * Island Ground Details: Weathered low-poly stones and grass tufts on the island plateau
     */
    function createIslandDetails() {
      // 1. Stones scattered across the island grass
      const rockMaterial = new THREE.MeshStandardMaterial({
        color: 0x353040,
        roughness: 0.9,
        flatShading: true
      });

      const rockCount = 28;
      for (let i = 0; i < rockCount; i++) {
        const radius = 0.2 + Math.random() * 0.5;
        const rockGeo = new THREE.DodecahedronGeometry(radius, 0);
        const rock = new THREE.Mesh(rockGeo, rockMaterial);

        const angle = Math.random() * Math.PI * 2;
        const dist = 1.5 + Math.random() * 12.0;

        rock.position.set(
          Math.cos(angle) * dist,
          0.5 + radius * 0.3,
          Math.sin(angle) * dist
        );
        rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        rock.castShadow = true;
        rock.receiveShadow = true;
        islandGroup.add(rock);
      }

      // 2. Wild Grass Tufts on island
      const grassBladeMat = new THREE.MeshStandardMaterial({
        color: 0x3aa56d,
        roughness: 0.8,
        side: THREE.DoubleSide,
        flatShading: true
      });

      const tuftCount = 35;
      for (let i = 0; i < tuftCount; i++) {
        const tuft = new THREE.Group();
        const blades = 3 + Math.floor(Math.random() * 3);
        const tuftHeight = 0.35 + Math.random() * 0.35;
        const tuftWidth = 0.1 + Math.random() * 0.06;

        for (let b = 0; b < blades; b++) {
          const bladeGeo = new THREE.PlaneGeometry(tuftWidth, tuftHeight);
          bladeGeo.translate(0, tuftHeight / 2, 0);

          const blade = new THREE.Mesh(bladeGeo, grassBladeMat);
          blade.rotation.y = (b / blades) * Math.PI;
          blade.rotation.x = (Math.random() - 0.5) * 0.2;
          blade.castShadow = true;
          tuft.add(blade);
        }

        const dist = 1.8 + Math.random() * 11.5;
        const angle = Math.random() * Math.PI * 2;
        tuft.position.set(Math.cos(angle) * dist, 0.5, Math.sin(angle) * dist);
        islandGroup.add(tuft);
      }
    }

    /**
     * Glow Texture Generator for Additive Particles
     */
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const context = canvas.getContext('2d');
      const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.25, 'rgba(255, 220, 180, 0.85)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    function createGroundMist() {
      // Soft overlapping horizontal wisps, rather than opaque fog walls.
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, 'rgba(170, 201, 235, 0.4)');
      gradient.addColorStop(0.45, 'rgba(170, 201, 235, 0.2)');
      gradient.addColorStop(1, 'rgba(170, 201, 235, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const geometry = new THREE.PlaneGeometry(1, 1);
      for (let i = 0; i < 16; i++) {
        const material = new THREE.MeshBasicMaterial({
          map: texture, color: 0x91b2d5, transparent: true, opacity: 0.25,
          depthWrite: false, side: THREE.DoubleSide
        });
        const mist = new THREE.Mesh(geometry, material);
        mist.rotation.x = -Math.PI / 2;
        mist.rotation.z = Math.random() * Math.PI;
        mist.scale.set(9 + Math.random() * 7, 3 + Math.random() * 4, 1);
        const angle = i * 2.39996;
        const radius = 3 + Math.sqrt(i / 16) * 9;
        const x = Math.cos(angle) * radius, z = Math.sin(angle) * radius;
        const y = 0.8 + Math.random() * 1.2;
        mist.position.set(x, y, z);
        mistLayers.push({ mesh: mist, x, y, z, phase: angle });
        scene.add(mist);
      }
    }

    /**
     * Bioluminescent Mushrooms & Fireflies (Constrained to Floating Island Volume)
     */
    function setupMushroomsAndFireflies() {
      // 1. Bioluminescent Cyan Mushrooms clustered near the main sakura roots
      const mushroomGroup = new THREE.Group();
      const mushroomMat = new THREE.MeshStandardMaterial({
        color: 0x00ffcc,
        emissive: 0x00ffcc,
        emissiveIntensity: 2.5,
        roughness: 0.4
      });
      const mushroomStemMat = new THREE.MeshStandardMaterial({
        color: 0x2a3b40,
        roughness: 0.8
      });

      for (let i = 0; i < 15; i++) {
        const mush = new THREE.Group();
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.07, 0.28, 6), mushroomStemMat);
        stem.position.y = 0.14;

        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.14, 6, 4, 0, Math.PI * 2, 0, Math.PI / 2), mushroomMat);
        cap.position.y = 0.28;

        mush.add(stem);
        mush.add(cap);

        const angle = Math.random() * Math.PI * 2;
        const radius = 1.5 + Math.random() * 3.5;
        mush.position.set(Math.cos(angle) * radius, 0.5, Math.sin(angle) * radius);
        mush.rotation.y = Math.random() * Math.PI;
        mushroomGroup.add(mush);
      }
      islandGroup.add(mushroomGroup);

      // 2. Firefly Particle System (300 particles floating over the island plateau)
      fireflyCount = 300;
      fireflyGeo = new THREE.BufferGeometry();
      const fireflyPositions = new Float32Array(fireflyCount * 3);
      const fireflyColors = new Float32Array(fireflyCount * 3);
      fireflyData = [];

      for (let i = 0; i < fireflyCount; i++) {
        // Confined across island radius (up to 15.5 units)
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 15.5;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const y = 0.8 + Math.random() * 7.5; // Hovering above island turf

        fireflyPositions[i * 3] = x;
        fireflyPositions[i * 3 + 1] = y;
        fireflyPositions[i * 3 + 2] = z;

        // Vivid glowing spectrum (golden-amber, soft rose, fairy cyan)
        const hue = (Math.random() < 0.4)
          ? 0.92 + Math.random() * 0.08  // Rose / pink
          : 0.12 + Math.random() * 0.25; // Warm gold to cyan
        const color = new THREE.Color().setHSL(hue, 1.0, 0.65);

        fireflyColors[i * 3] = color.r;
        fireflyColors[i * 3 + 1] = color.g;
        fireflyColors[i * 3 + 2] = color.b;

        fireflyData.push({
          home: new THREE.Vector3(x, y, z),
          velocity: new THREE.Vector3(),
          color: color.clone(),
          speed: 0.5 + Math.random(),
          phaseX: Math.random() * Math.PI * 2,
          phaseY: Math.random() * Math.PI * 2,
          phaseZ: Math.random() * Math.PI * 2
        });
      }

      fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPositions, 3));
      fireflyGeo.setAttribute('color', new THREE.BufferAttribute(fireflyColors, 3));

      fireflyMat = new THREE.PointsMaterial({
        size: 0.55,
        map: createGlowTexture(),
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      fireflies = new THREE.Points(fireflyGeo, fireflyMat);
      // Initial bounds do not cover every possible drift position.
      fireflyGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 5, 0), 23);
      scene.add(fireflies);
    }

    /**
     * Viewport Resize Event Handler
     */
    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      if (composer) {
        composer.setPixelRatio(renderer.getPixelRatio());
        composer.setSize(width, height);
      }
    }

    /**
     * Main Animation Loop
     */
    function animate() {
      requestAnimationFrame(animate);

      // Smooth camera orbit
      const dt = Math.min(clock.getDelta(), 0.04);
      const time = clock.elapsedTime;
      controls.update(dt);
      let cursorHit = false;
      if (pointerActive) {
        raycaster.setFromCamera(pointer, camera);
        cursorHit = raycaster.ray.intersectPlane(hoverPlane, cursorWorld) !== null;
        cursorHit = cursorHit && cursorWorld.lengthSq() < 24 * 24;
      }
      for (const layer of mistLayers) {
        layer.mesh.position.set(layer.x + Math.sin(time * 0.09 + layer.phase) * 1.5,
          layer.y + Math.sin(time * 0.15 + layer.phase) * 0.15,
          layer.z + Math.cos(time * 0.07 + layer.phase) * 0.8);
        layer.mesh.material.opacity = 0.22 + Math.sin(time * 0.2 + layer.phase) * 0.05;
      }
      for (const { mesh, rest, phase, amplitude } of crowns) {
        mesh.position.x = rest.x + Math.sin(time * 0.8 + phase) * amplitude;
        mesh.position.z = rest.z + Math.sin(time * 0.63 + phase) * amplitude * 0.6;
        mesh.rotation.z = Math.sin(time * 0.8 + phase) * 0.012;
      }
      if (waterSurface) {
        const position = waterSurface.geometry.attributes.position;
        for (let i = 0; i < position.count; i++) {
          const x = waterRestPositions[i * 3], z = waterRestPositions[i * 3 + 2];
          position.setY(i, Math.sin(x * 1.3 + z * 0.8 + time * 0.9) * 0.025
            + Math.cos(z * 1.6 - x * 0.5 + time * 0.7) * 0.018);
        }
        position.needsUpdate = true;
        waterSurface.geometry.computeVertexNormals();
      }

      // Harmonic kinematic firefly drift (kept over the floating island)
      if (fireflies && fireflyData && fireflyData.length) {
        const positions = fireflies.geometry.attributes.position.array;
        const colors = fireflies.geometry.attributes.color.array;

        for (let i = 0; i < fireflyCount; i++) {
          const data = fireflyData[i];
          const i3 = i * 3;

          const x = positions[i3], y = positions[i3 + 1], z = positions[i3 + 2];
          const velocity = data.velocity;
          velocity.x += ((data.home.x - x) * 0.22
            + Math.sin(time * data.speed * 0.6 + data.phaseX) * 0.85) * dt;
          velocity.y += ((data.home.y - y) * 0.35
            + Math.cos(time * data.speed * 0.7 + data.phaseY) * 0.6) * dt;
          velocity.z += ((data.home.z - z) * 0.22
            + Math.sin(time * data.speed * 0.5 + data.phaseZ) * 0.85) * dt;
          if (cursorHit) {
            const dx = x - cursorWorld.x, dy = y - cursorWorld.y, dz = z - cursorWorld.z;
            const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (distance < 4.5) {
              const force = 7 * Math.pow(1 - distance / 4.5, 2) * dt / Math.max(distance, 0.15);
              velocity.x += dx * force;
              velocity.y += dy * force;
              velocity.z += dz * force;
            }
          }
          velocity.multiplyScalar(Math.exp(-0.9 * dt)).clampLength(0, 2.5);
          positions[i3] += velocity.x * dt;
          positions[i3 + 1] = Math.max(0.7, y + velocity.y * dt);
          positions[i3 + 2] += velocity.z * dt;
          const pulse = 1.5 + Math.pow(0.5 + 0.5 * Math.sin(time * data.speed * 1.8 + data.phaseY), 3) * 3;
          colors[i3] = data.color.r * pulse;
          colors[i3 + 1] = data.color.g * pulse;
          colors[i3 + 2] = data.color.b * pulse;
        }

        fireflies.geometry.attributes.position.needsUpdate = true;
        fireflies.geometry.attributes.color.needsUpdate = true;
      }

      // Render through Bloom Post-processing
      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    // Launch scene on DOM load
    window.addEventListener('DOMContentLoaded', init);
  </script>
